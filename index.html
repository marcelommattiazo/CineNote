    </ol>
    <div class="linha-chave">
      <input type="text" data-chave-tmdb value="${esc(chaveTMDB())}" placeholder="Cole a chave do TMDB" aria-label="Chave do TMDB" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="botao primario" data-acao="guardar-chave" data-contexto="${contexto}">Testar</button>
    </div>
    <p class="ajuda" data-situacao-chave style="margin-top:8px">${chaveTMDB() ? `Chave guardada, terminando em ${esc(chaveTMDB().slice(-5))}.` : 'A chave fica guardada só no seu diário.'}</p>
  </div>`;
}

/* ===== Início ===== */

function telaBoasVindas() {
  return `<section class="boas-vindas">
      <h2>Tudo o que você assistir, num diário só seu.</h2>
      <p>Registre filmes e temporadas de séries com data, nota, favorito e onde assistiu. O app funciona sem internet e guarda tudo neste aparelho.</p>
      <div class="acoes" style="margin-top:20px">
        <button type="button" class="botao primario" data-acao="registrar">${icone('mais', 18, { traco: 2.4 })}Registrar o primeiro</button>
        <button type="button" class="botao" data-acao="importar-letterboxd">Importar do Letterboxd</button>
        <button type="button" class="botao" data-acao="importar-serializd">Importar do Serializd</button>
      </div>
    </section>
    ${chaveTMDB() ? '' : `<section class="secao">${cartaoChaveHTML()}</section>`}
    <section class="secao">
      <div class="cartao">
        <h3>Já tem uma cópia de segurança?</h3>
        <p class="detalhe">Traga o diário de outro aparelho escolhendo o arquivo .json, ou ligue o OneDrive em Configurações.</p>
        <div class="acoes"><button type="button" class="botao pequeno" data-acao="restaurar-arquivo">Restaurar de um arquivo</button></div>
      </div>
    </section>`;
}

function seriesEmAndamento() {
  return dados.titulos
    .filter(t => t.tipo === 'serie' && (t.situacao === 'assistindo' || temNovaTemporada(t)))
    .sort((a, b) => String(ultimaVez(b) || b.criadoEm).localeCompare(String(ultimaVez(a) || a.criadoEm)));
}

function cartaoSerieHTML(t) {
  const nova = temNovaTemporada(t);
  const proxima = nova ? nova.n : proximaTemporada(t);
  const reais = temporadasReais(t);
  const vistas = temporadasVistas(t);
  const barras = reais.length && reais.length <= 24
    ? `<div class="progresso-temporadas" aria-hidden="true">${reais.map(s => `<i class="${vistas.has(s.n) ? 'vista' : s.n === proxima ? 'atual' : ''}"></i>`).join('')}</div>`
    : '';
  const texto = nova
    ? `Chegou a temporada ${nova.n}`
    : reais.length ? `Vendo a temporada ${proxima} de ${reais.length}` : `Vendo a temporada ${proxima}`;
  return `<article class="cartao-serie">
    <button type="button" class="poster-botao" data-acao="abrir-titulo" data-id="${esc(t.id)}" aria-label="Abrir ${esc(nomeDe(t))}">${posterHTML(t, { tamanho: 'w154', dobro: 'w342' })}</button>
    <div>
      <h3>${esc(nomeDe(t))}</h3>
      <p class="detalhe" style="margin-bottom:0">${esc(texto)}</p>
      ${barras}
    </div>
    <button type="button" class="botao primario pequeno cartao-serie-acao" data-acao="registrar-temporada" data-id="${esc(t.id)}" data-temporada="${proxima}">Terminei a temporada ${proxima}</button>
  </article>`;
}

function numerosDoPeriodo(lista) {
  const filmes = lista.filter(x => x.t.tipo === 'filme');
  const temporadas = lista.filter(x => x.t.tipo === 'serie');
  const minutos = lista.reduce((s, x) => s + minutosDoRegistro(x.r, x.t), 0);
  const comNota = lista.filter(x => x.r.nota);
  const media = comNota.length ? comNota.reduce((s, x) => s + x.r.nota, 0) / comNota.length : null;
  return { filmes: filmes.length, temporadas: temporadas.length, horas: Math.round(minutos / 60), media, total: lista.length };
}

function numerosHTML(n) {
  return `<div class="numeros">
    <div class="numero"><strong>${numero(n.filmes)}</strong><span>${n.filmes === 1 ? 'filme' : 'filmes'}</span></div>
    <div class="numero"><strong>${numero(n.temporadas)}</strong><span>${n.temporadas === 1 ? 'temporada' : 'temporadas'}</span></div>
    <div class="numero"><strong>${numero(n.horas)}</strong><span>${n.horas === 1 ? 'hora' : 'horas'} de tela</span></div>
    <div class="numero"><strong>${n.media === null ? '–' : numero(n.media, 1)}</strong><span>nota média</span></div>
  </div>`;
}

function blocoMeta(ano) {
  const vistos = filmesNoAno(ano);
  const meta = Number(dados.metas[ano]) || 0;
  const cabecalho = `<div class="secao-cabecalho"><h2 class="titulo-secao">Meta de ${ano}</h2><button type="button" class="link" data-acao="definir-meta" data-ano="${ano}">${meta ? 'Alterar' : 'Definir'}</button></div>`;
  if (!meta) {
    return `${cabecalho}<div class="meta-linha"><strong>${numero(vistos)}</strong><span>${vistos === 1 ? 'filme' : 'filmes'} em ${ano}. Defina quantos quer ver no ano e acompanhe o ritmo aqui.</span></div>
      <p class="detalhe" style="margin-top:6px"><button type="button" class="link" data-acao="mostrar-metas" data-valor="nao">Não uso metas</button></p>`;
  }
  const inicioAno = new Date(Number(ano), 0, 1);
  const fimAno = new Date(Number(ano) + 1, 0, 1);
  const fracao = Math.min(1, Math.max(0, (Date.now() - inicioAno) / (fimAno - inicioAno)));
  const esperado = Math.floor(meta * fracao);
  const projecao = fracao > 0.08 ? Math.round(vistos / fracao) : null;
  let situacao;
  if (vistos >= meta) situacao = 'Meta cumprida.';
  else if (vistos >= esperado) situacao = `Você está no ritmo: o esperado até hoje era ${plural(esperado, 'filme', 'filmes')}.`;
  else situacao = `Faltam ${plural(esperado - vistos, 'filme', 'filmes')} para voltar ao ritmo.`;
  if (projecao !== null && vistos < meta) situacao += ` Nesse passo, o ano fecha com ${plural(projecao, 'filme', 'filmes')}.`;
  return `${cabecalho}
    <div class="meta-linha"><strong>${numero(vistos)}</strong><span>de ${plural(meta, 'filme', 'filmes')}</span></div>
    <div class="barra-meta" role="progressbar" aria-valuemin="0" aria-valuemax="${meta}" aria-valuenow="${vistos}" aria-label="Filmes vistos em ${ano}">
      <span style="width:${Math.min(100, vistos / meta * 100)}%"></span>
      <i style="left:${Math.min(100, fracao * 100)}%" title="Esperado até hoje"></i>
    </div>
    <p class="detalhe">${situacao}</p>`;
}

function telaInicio() {
  if (!dados.registros.length && !dados.titulos.length) return telaBoasVindas();
  const ano = hojeISO().slice(0, 4);
  const andamento = seriesEmAndamento();
  const recentes = registrosComTitulo().filter(x => x.r.data).sort((a, b) => compararRegistros(a.r, b.r)).slice(0, 14);
  const favoritos = dados.titulos.filter(t => t.favorito)
    .sort((a, b) => String(ultimaVez(b) || '').localeCompare(String(ultimaVez(a) || ''))).slice(0, 14);
  const doAno = registrosComTitulo().filter(x => x.r.data && x.r.data.startsWith(ano));
  const filaRegistro = ({ r, t }) => `<button type="button" class="tile" data-acao="abrir-titulo" data-id="${esc(t.id)}" data-registro="${esc(r.id)}" aria-label="${esc(nomeDe(t))}, ${esc(dataExtensa(r.data))}">
      ${posterHTML(t, { caminho: posterDoRegistro(r, t) })}
      <span class="tile-linha">${estrelasHTML(r.nota, 11)}${coracaoMini(t, 12)}</span>
    </button>`;
  return `${chaveTMDB() ? '' : `<section class="secao">${cartaoChaveHTML()}</section>`}
    ${andamento.length ? `<section class="secao">
      <div class="secao-cabecalho"><h2 class="titulo-secao">Assistindo agora</h2></div>
      <div class="andamento">${andamento.map(cartaoSerieHTML).join('')}</div>
    </section>` : ''}
    <section class="secao">
      <div class="secao-cabecalho"><h2 class="titulo-secao">Últimos registros</h2><button type="button" class="link" data-acao="aba" data-aba="diario">Ver diário</button></div>
      ${recentes.length ? `<div class="fila">${recentes.map(filaRegistro).join('')}</div>` : '<p class="vazio">Os registros com data aparecem aqui.</p>'}
    </section>
    ${dados.preferencias.mostrarMetas ? `<section class="secao">${blocoMeta(ano)}</section>` : ''}
    <section class="secao">
      <div class="secao-cabecalho"><h2 class="titulo-secao">Em ${ano}</h2><button type="button" class="link" data-acao="aba" data-aba="estatisticas">Estatísticas</button></div>
      ${numerosHTML(numerosDoPeriodo(doAno))}
    </section>
    ${favoritos.length ? `<section class="secao">
      <div class="secao-cabecalho"><h2 class="titulo-secao">Favoritos</h2><button type="button" class="link" data-acao="ver-favoritos">Ver todos</button></div>
      <div class="fila">${favoritos.map(t => tileHTML(t)).join('')}</div>
    </section>` : ''}`;
}

/* ===== Filtros ===== */

const ORDENS_QUERO = [
  ['recente', 'Adicionados por último'],
  ['lancamento', 'Lançamento'],
  ['titulo', 'Título'],
  ['curtos', 'Mais curtos primeiro'],
];

function bateFiltros(f, t, regs, ignorar = '') {
  return (ignorar === 'onde' || !f.onde || regs.some(r => (f.onde === 'sem' ? !r.onde : r.onde === f.onde)))
    && (ignorar === 'genero' || !f.genero || t.generos.includes(f.genero))
    && (ignorar === 'tipo' || !f.tipo || t.tipo === f.tipo)
    && (ignorar === 'situacao' || !f.situacao || t.situacao === f.situacao)
    && (!f.favoritos || t.favorito);
}

function registrosFiltrados(f, ignorar = '') {
  const busca = f.busca.trim();
  return registrosComTitulo()
    .filter(({ r, t }) => bateFiltros(f, t, [r], ignorar) && bateBusca(t, busca, `${r.comentario} ${(plataformaPorId(r.onde) || {}).nome || ''} ${(r.tags || []).join(' ')}`))
    .sort((a, b) => compararRegistros(a.r, b.r));
}

function disponivelEm(t, onde) {
  const lista = t.disponivel || [];
  return onde === 'sem' ? !!t.disponivelEm && !lista.length : lista.includes(onde);
}

function queroVerFiltrados(f, ignorar = '') {
  const busca = f.busca.trim();
  const lista = dados.titulos.filter(t => t.querVer
    && (ignorar === 'onde' || !f.onde || disponivelEm(t, f.onde))
    && (ignorar === 'genero' || !f.genero || t.generos.includes(f.genero))
    && (ignorar === 'tipo' || !f.tipo || t.tipo === f.tipo)
    && bateBusca(t, busca));
  const lancamento = t => t.estreia || (t.ano ? `${t.ano}-01-01` : '');
  const comparadores = {
    recente: (a, b) => String(b.querVerEm || '').localeCompare(String(a.querVerEm || '')) || String(b.criadoEm).localeCompare(String(a.criadoEm)),
    lancamento: (a, b) => lancamento(b).localeCompare(lancamento(a)),
    titulo: (a, b) => colador.compare(semArtigo(nomeDe(a)), semArtigo(nomeDe(b))),
    curtos: (a, b) => (a.duracao || 9999) - (b.duracao || 9999),
  };
  const comparar = comparadores[f.ordem] || comparadores.recente;
  return lista.sort((a, b) => comparar(a, b) || colador.compare(semArtigo(nomeDe(a)), semArtigo(nomeDe(b))));
}

function filtrosAtivos(f) {
  return !!(f.busca.trim() || f.onde || f.genero || f.tipo || f.favoritos || f.situacao);
}

function barraFiltrosHTML(escopo) {
  const f = estado[escopo];
  const quero = escopo === 'querover';
  const pilula = (filtro, rotuloVazio, valor, rotulo, cor) => valor
    ? `<button type="button" class="pilula ativa" data-acao="filtro-folha" data-escopo="${escopo}" data-filtro="${filtro}">${cor ? `<span class="ponto" style="--cor:${cor}"></span>` : ''}${esc(rotulo)}<span class="limpar" data-acao="limpar-filtro" data-escopo="${escopo}" data-filtro="${filtro}" aria-label="Tirar filtro">×</span></button>`
    : `<button type="button" class="pilula" data-acao="filtro-folha" data-escopo="${escopo}" data-filtro="${filtro}">${rotuloVazio}</button>`;
  const plataforma = f.onde && f.onde !== 'sem' ? plataformaPorId(f.onde) : null;
  const rotuloOnde = f.onde === 'sem' ? (quero ? 'Sem streaming' : 'Sem lugar') : plataforma ? plataforma.nome : '';
  const tipos = { filme: 'Filmes', serie: 'Séries' };
  const placeholder = quero ? 'Buscar no Quero ver' : 'Buscar no diário';
  const fim = quero
    ? `<button type="button" class="pilula" data-acao="filtro-folha" data-escopo="querover" data-filtro="ordem">${esc((ORDENS_QUERO.find(o => o[0] === f.ordem) || ORDENS_QUERO[0])[1])}</button>`
    : `<button type="button" class="pilula pilula-coracao" data-acao="filtrar-favoritos" data-escopo="${escopo}" aria-pressed="${!!f.favoritos}" aria-label="Só favoritos" title="Só favoritos">${icone('coracao', 17)}</button>`;
  return `<div class="barra">
    <input type="search" placeholder="${placeholder}" value="${esc(f.busca)}" data-filtro-busca="${escopo}" aria-label="${placeholder}" enterkeyhint="search" autocomplete="off">
    <div class="filtros">
      ${pilula('onde', quero ? 'Onde tem' : 'Onde assistiu', f.onde, rotuloOnde, plataforma ? corSegura(plataforma.cor) : '')}
      ${pilula('genero', 'Gênero', f.genero, GENERO_ROTULO[f.genero] || '')}
      ${pilula('tipo', 'Filmes e séries', f.tipo, tipos[f.tipo] || '')}
      ${fim}
    </div>
  </div>`;
}

function abrirFolhaFiltro(escopo, filtro) {
  const f = estado[escopo];
  const quero = escopo === 'querover';
  const base = quero ? queroVerFiltrados(f, filtro) : registrosFiltrados(f, filtro);
  const contar = teste => base.filter(teste).length;
  const tituloDe = x => (quero ? x : x.t);
  let titulo = '';
  let opcoes = [];
  if (filtro === 'onde' && quero) {
    titulo = 'Onde tem';
    opcoes = [
      ['', 'Qualquer lugar', base.length],
      ...dados.plataformas.map(p => [p.id, p.nome, contar(t => disponivelEm(t, p.id)), p.cor]),
      ['sem', 'Sem streaming', contar(t => disponivelEm(t, 'sem'))],
    ];
  } else if (filtro === 'onde') {
    titulo = 'Onde assistiu';
    opcoes = [
      ['', 'Todos os lugares', base.length],
      ...dados.plataformas.map(p => [p.id, p.nome, contar(x => x.r.onde === p.id), p.cor]),
      ['sem', 'Sem lugar registrado', contar(x => !x.r.onde)],
    ];
  } else if (filtro === 'genero') {
    titulo = 'Gênero';
    opcoes = [['', 'Todos os gêneros', base.length], ...GENEROS.map(([id, nome]) => [id, nome, contar(x => tituloDe(x).generos.includes(id))])];
  } else if (filtro === 'tipo') {
    titulo = 'Filmes e séries';
    opcoes = [['', 'Filmes e séries', base.length], ['filme', 'Só filmes', contar(x => tituloDe(x).tipo === 'filme')], ['serie', 'Só séries', contar(x => tituloDe(x).tipo === 'serie')]];
  } else if (filtro === 'ordem') {
    titulo = 'Ordenar';
    opcoes = ORDENS_QUERO.map(([id, nome]) => [id, nome, null]);
  }
  const atual = f[filtro] || (filtro === 'ordem' ? 'recente' : '');
  const visiveis = opcoes.filter(([valor, , qtd]) => valor === '' || valor === atual || qtd === null || qtd > 0);
  const ocultas = opcoes.length - visiveis.length;
  const vazias = quero ? 'sem títulos' : 'sem registros';
  let ajuda = '';
  if (quero && filtro === 'onde') ajuda = 'Mostra onde cada título está disponível no Brasil agora, pelos dados do TMDB, conferidos a cada poucos dias.';
  else if (ocultas && filtro !== 'ordem') ajuda = `${ocultas === 1 ? `1 opção ${vazias} ficou de fora` : `${ocultas} opções ${vazias} ficaram de fora`}${filtro === 'onde' ? '. A lista de lugares fica em Configurações.' : '.'}`;
  abrirModal({
    janela: '#modal-folha',
    classe: 'pequeno folha',
    titulo,
    corpo: `<div class="chips">${visiveis.map(([valor, nome, qtd, cor]) => `<button type="button" class="chip" data-acao="aplicar-filtro" data-escopo="${escopo}" data-filtro="${filtro}" data-valor="${esc(valor)}" aria-pressed="${valor === atual}">${cor ? `<span class="ponto" style="--cor:${corSegura(cor)}"></span>` : ''}${esc(nome)}${qtd !== null && qtd !== undefined ? `<span class="qtd">${numero(qtd)}</span>` : ''}</button>`).join('')}</div>
      ${ajuda ? `<p class="ajuda" style="margin-top:14px">${ajuda}</p>` : ''}`,
  });
}

/* ===== Diário ===== */

function telaDiario() {
  return barraFiltrosHTML('diario') + `<div id="resultados">${conteudoDiario()}</div>`;
}

function conteudoDiario() {
  const f = estado.diario;
  const total = dados.registros.length;
  if (!total) {
    return `<p class="vazio">Seu diário está vazio. Toque em + para registrar o último filme ou temporada que você viu.</p>
      <div class="acoes"><button type="button" class="botao primario" data-acao="registrar">Registrar</button><button type="button" class="botao" data-acao="importar-letterboxd">Importar do Letterboxd</button></div>`;
  }
  const lista = registrosFiltrados(f);
  const filtrado = filtrosAtivos(f);
  const contagem = filtrado ? `<p class="contagem">${numero(lista.length)} de ${plural(total, 'registro', 'registros')}${lista.length ? ` <button type="button" class="link" data-acao="limpar-filtros" data-escopo="diario">Limpar filtros</button>` : ''}</p>` : '';
  if (!lista.length) {
    return `${contagem}<p class="vazio">Nenhum registro com esses filtros.</p><div class="acoes"><button type="button" class="botao pequeno" data-acao="limpar-filtros" data-escopo="diario">Limpar filtros</button></div>`;
  }
  const grupos = new Map();
  for (const item of lista) {
    const chave = item.r.data ? item.r.data.slice(0, 7) : 'sem-data';
    if (!grupos.has(chave)) grupos.set(chave, []);
    grupos.get(chave).push(item);
  }
  return contagem + [...grupos].map(([chave, itens]) => `<h2 class="faixa-mes">${chave === 'sem-data' ? 'Sem data' : mesAno(chave)}<small>${plural(itens.length, 'registro', 'registros')}</small></h2>
      <ul class="lista-diario">${itens.map(({ r, t }) => linhaDiarioHTML(r, t)).join('')}</ul>`).join('');
}

/* ===== Quero ver ===== */

function tileQueroVerHTML(t) {
  const lugares = (t.disponivel || []).map(plataformaPorId).filter(Boolean);
  const nomes = lugares.map(p => p.nome);
  const rotulo = `${nomeDe(t)}${t.ano ? `, ${t.ano}` : ''}${nomes.length ? `, disponível em ${juntarNomes(nomes)}` : ''}`;
  return `<button type="button" class="tile" data-acao="abrir-titulo" data-id="${esc(t.id)}" aria-label="${esc(rotulo)}">
    ${posterHTML(t)}
    <span class="tile-linha">${lugares.slice(0, 5).map(p => `<i class="ponto-lugar" style="--cor:${corSegura(p.cor)}" title="${esc(p.nome)}"></i>`).join('')}</span>
  </button>`;
}

function telaQueroVer() {
  return barraFiltrosHTML('querover') + `<div id="resultados">${conteudoQueroVer()}</div>`;
}

function conteudoQueroVer() {
  const f = estado.querover;
  if (!dados.titulos.some(t => t.querVer)) {
    return `<p class="vazio">Guarde aqui os filmes e séries que você quer ver. Na busca, toque no marcador ao lado do título; na ficha, toque em Quero ver.</p>
      <div class="acoes"><button type="button" class="botao primario" data-acao="registrar">Buscar filme ou série</button></div>
      <p class="ajuda" style="margin-top:14px">A watchlist do Letterboxd e a do Serializd também vêm para cá, pelas importações em Configurações.</p>`;
  }
  const lista = queroVerFiltrados(f);
  const filmes = lista.filter(t => t.tipo === 'filme').length;
  const series = lista.length - filmes;
  const partes = [filmes ? plural(filmes, 'filme', 'filmes') : '', series ? plural(series, 'série', 'séries') : ''].filter(Boolean);
  const contagem = `<p class="contagem">${partes.length ? juntarNomes(partes) : 'Nenhum título'}${filtrosAtivos(f) ? ` <button type="button" class="link" data-acao="limpar-filtros" data-escopo="querover">Limpar filtros</button>` : ''}</p>`;
  if (!lista.length) return `${contagem}<p class="vazio">Nenhum título com esses filtros.</p>`;
  const algumLugar = lista.some(t => (t.disponivel || []).length);
  return contagem + `<div class="grade">${lista.map(tileQueroVerHTML).join('')}</div>`
    + (algumLugar ? '<p class="nota-rodape" style="margin-top:18px">Os pontos coloridos embaixo de cada pôster mostram em quais dos seus serviços o título está disponível agora.</p>' : '');
}

/* ===== Estatísticas ===== */

function graficoColunas(rotulos, valores, { formatar = v => numero(v), destaque = null } = {}) {
  const poucos = rotulos.length <= 4;
  const largura = poucos ? 42 : rotulos.length > 10 ? 18 : 24;
  const espaco = poucos ? 24 : rotulos.length > 10 ? 8 : 10;
  const topo = 20, base = 22, altura = 170;
  const total = rotulos.length * (largura + espaco) + espaco;
  const maximo = Math.max(1, ...valores);
  const colunas = valores.map((v, i) => {
    const x = espaco + i * (largura + espaco);
    const alt = Math.max(v ? 3 : 0, Math.round((altura - topo - base) * v / maximo));
    const y = altura - base - alt;
    return `<rect class="barra" x="${x}" y="${y}" width="${largura}" height="${alt}" rx="3"${destaque !== null && destaque !== i ? ' opacity=".55"' : ''}></rect>`
      + (v ? `<text class="valor" x="${x + largura / 2}" y="${y - 6}" text-anchor="middle">${formatar(v)}</text>` : '')
      + `<text x="${x + largura / 2}" y="${altura - 6}" text-anchor="middle">${esc(rotulos[i])}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${total} ${altura}" style="max-width:${Math.round(total * 1.25)}px" role="img"><line class="eixo" x1="0" x2="${total}" y1="${altura - base + 0.5}" y2="${altura - base + 0.5}"></line>${colunas}</svg>`;
}

function rankingHTML(itens, vazio = 'Sem dados no período.') {
  if (!itens.length) return `<p class="vazio">${vazio}</p>`;
  const maximo = Math.max(1, ...itens.map(i => i.valor));
  return `<ol class="ranking">${itens.map(i => `<li><span class="nome" title="${esc(i.rotulo)}">${esc(i.rotulo)}</span><span class="trilho"><span style="width:${i.valor / maximo * 100}%${i.cor ? `;background:${corSegura(i.cor)}` : ''}"></span></span><span class="qtd">${numero(i.valor)}</span></li>`).join('')}</ol>`;
}

function contarPor(lista, chaves) {
  const mapa = new Map();
  for (const item of lista) {
    for (const chave of chaves(item)) {
      if (!chave) continue;
      mapa.set(chave, (mapa.get(chave) || 0) + 1);
    }
  }
  return mapa;
}

function telaEstatisticas() {
  const todos = registrosComTitulo();
  const anoAtual = hojeISO().slice(0, 4);
  const anos = [...new Set([...todos.filter(x => x.r.data).map(x => x.r.data.slice(0, 4)), anoAtual])].sort().reverse();
  if (estado.estatisticas.ano !== 'todos' && !anos.includes(estado.estatisticas.ano)) estado.estatisticas.ano = anoAtual;
  const sel = estado.estatisticas.ano;
  const lista = sel === 'todos' ? todos : todos.filter(x => x.r.data && x.r.data.startsWith(sel));
  const seletor = `<div class="segmentado" role="group" aria-label="Período">
      ${anos.map(a => `<button type="button" data-acao="ano-estatisticas" data-ano="${a}" aria-pressed="${sel === a}">${a}</button>`).join('')}
      <button type="button" data-acao="ano-estatisticas" data-ano="todos" aria-pressed="${sel === 'todos'}">Todos os anos</button>
    </div>`;
  if (!todos.length) return `${seletor}<p class="resumo">As estatísticas aparecem depois dos primeiros registros no diário.</p>`;
  const n = numerosDoPeriodo(lista);
  let resumo;
  if (!lista.length) {
    resumo = `Nenhum registro em ${sel} até agora.`;
  } else {
    const periodo = sel === 'todos' ? 'No total' : sel === anoAtual ? `Em ${sel}, até agora` : `Em ${sel}`;
    const partes = [n.filmes ? plural(n.filmes, 'filme', 'filmes') : '', n.temporadas ? plural(n.temporadas, 'temporada de série', 'temporadas de séries') : ''].filter(Boolean);
    resumo = `${periodo}, você registrou ${juntarNomes(partes)}${n.horas ? `, somando ${plural(n.horas, 'hora', 'horas')} de tela` : ''}.`;
    if (n.media !== null) resumo += ` A nota média foi ${numero(n.media, 1)}.`;
    const revistos = lista.filter(x => x.r.revisto).length;
    if (revistos) resumo += ` ${revistos === 1 ? '1 registro foi revisão' : `${numero(revistos)} registros foram revisões`}.`;
  }
  const semDuracao = lista.filter(x => !minutosDoRegistro(x.r, x.t)).length;

  let graficos = '';
  if (lista.length) {
    const datados = lista.filter(x => x.r.data);
    let tempo;
    if (sel === 'todos') {
      const anosAsc = [...anos].reverse();
      tempo = `<figure class="grafico"><h3>Por ano</h3>${graficoColunas(anosAsc, anosAsc.map(a => datados.filter(x => x.r.data.startsWith(a)).length))}</figure>`;
    } else {
      const porMes = MESES.map((_, i) => datados.filter(x => Number(x.r.data.slice(5, 7)) === i + 1).length);
      tempo = `<figure class="grafico"><h3>Por mês</h3>${graficoColunas(MESES, porMes, { destaque: sel === anoAtual ? new Date().getMonth() : null })}</figure>`;
    }
    const notas = Array.from({ length: 10 }, (_, i) => (i + 1) / 2);
    const porNota = notas.map(v => lista.filter(x => x.r.nota === v).length);
    const graficoNotas = porNota.some(Boolean)
      ? `<figure class="grafico"><h3>Suas notas</h3>${graficoColunas(notas.map(v => notaTexto(v)), porNota)}</figure>`
      : '';
    const porSemana = DIAS_SEMANA.map((_, i) => datados.filter(x => paraData(x.r.data).getDay() === i).length);
    const ondes = contarPor(lista, x => [x.r.onde || 'sem']);
    const rankingOnde = [...ondes].map(([id, valor]) => {
      const p = plataformaPorId(id);
      return { rotulo: p ? p.nome : id === 'sem' ? 'Sem lugar registrado' : 'Lugar removido', valor, cor: p ? p.cor : '#6B7785' };
    }).sort((a, b) => b.valor - a.valor);
    const generos = contarPor(lista, x => x.t.generos);
    const rankingGeneros = [...generos].map(([id, valor]) => ({ rotulo: GENERO_ROTULO[id], valor })).sort((a, b) => b.valor - a.valor).slice(0, 10);
    const filmes = lista.filter(x => x.t.tipo === 'filme');
    const direcao = contarPor(filmes, x => x.t.direcao);
    const rankingDirecao = [...direcao].map(([rotulo, valor]) => ({ rotulo, valor })).filter(i => i.valor > 1).sort((a, b) => b.valor - a.valor || colador.compare(a.rotulo, b.rotulo)).slice(0, 8);
    const decadas = contarPor(filmes, x => (x.t.ano ? [`${Math.floor(x.t.ano / 10) * 10}`] : []));
    const rankingDecadas = [...decadas]
      .map(([d, valor]) => ({ decada: Number(d), valor }))
      .sort((a, b) => b.decada - a.decada)
      .map(i => ({ ...i, rotulo: i.decada >= 2000 || i.decada < 1920 ? `Anos ${i.decada}` : `Anos ${String(i.decada).slice(2)}` }));
    const melhores = [];
    const vistosMelhores = new Set();
    for (const x of [...lista].filter(x => x.r.nota).sort((a, b) => b.r.nota - a.r.nota || compararRegistros(a.r, b.r))) {
      if (vistosMelhores.has(x.t.id)) continue;
      vistosMelhores.add(x.t.id);
      melhores.push(x);
      if (melhores.length >= 12) break;
    }
    graficos = `<div class="graficos">
        ${tempo}
        ${graficoNotas}
        <figure class="grafico"><h3>Onde assistiu</h3>${rankingHTML(rankingOnde)}</figure>
        <figure class="grafico"><h3>Gêneros</h3>${rankingHTML(rankingGeneros)}</figure>
        ${rankingDirecao.length ? `<figure class="grafico"><h3>Direção mais vista</h3>${rankingHTML(rankingDirecao)}</figure>` : ''}
        ${rankingDecadas.length ? `<figure class="grafico"><h3>Filmes por década de lançamento</h3>${rankingHTML(rankingDecadas)}</figure>` : ''}
        ${datados.length ? `<figure class="grafico"><h3>Dia da semana</h3>${graficoColunas(DIAS_SEMANA, porSemana)}</figure>` : ''}
      </div>
      ${melhores.length ? `<section class="secao"><div class="secao-cabecalho"><h2 class="titulo-secao">Mais bem avaliados</h2></div>
        <div class="fila">${melhores.map(({ r, t }) => `<button type="button" class="tile" data-acao="abrir-titulo" data-id="${esc(t.id)}" aria-label="${esc(nomeDe(t))}, nota ${notaTexto(r.nota)}">${posterHTML(t, { caminho: posterDoRegistro(r, t) })}<span class="tile-linha">${estrelasHTML(r.nota, 11)}</span></button>`).join('')}</div>
      </section>` : ''}`;
  }

  const filmesPorAno = {};
  todos.forEach(x => { if (x.r.data && x.t.tipo === 'filme') { const a = x.r.data.slice(0, 4); filmesPorAno[a] = (filmesPorAno[a] || 0) + 1; } });
  const anosMetas = [...new Set([...anos, ...Object.keys(dados.metas)])].sort().reverse();
  const linhasMetas = anosMetas.map(a => {
    const meta = Number(dados.metas[a]) || 0;
    const vistos = filmesPorAno[a] || 0;
    let resultado;
    if (!meta) resultado = `<button type="button" class="link" data-acao="definir-meta" data-ano="${a}">Definir meta</button>`;
    else if (vistos >= meta) resultado = 'Cumprida';
    else if (a < anoAtual) resultado = `Faltaram ${numero(meta - vistos)}`;
    else resultado = `Faltam ${numero(meta - vistos)}`;
    return `<tr><td>${a}</td><td class="num">${meta ? numero(meta) : '–'}</td><td class="num">${numero(vistos)}</td><td>${resultado}</td></tr>`;
  }).join('');

  return `${seletor}
    <p class="resumo">${resumo}</p>
    ${lista.length ? numerosHTML(n) : ''}
    ${semDuracao && lista.length ? `<p class="nota-rodape">${semDuracao === 1 ? '1 registro está' : `${numero(semDuracao)} registros estão`} sem duração conhecida e ${semDuracao === 1 ? 'fica' : 'ficam'} fora das horas.</p>` : ''}
    ${graficos}
    ${dados.preferencias.mostrarMetas ? `<section class="secao">
      <div class="secao-cabecalho"><h2 class="titulo-secao">Metas de filmes por ano</h2></div>
      <div style="overflow-x:auto"><table class="tabela" style="max-width:520px"><thead><tr><th>Ano</th><th class="num">Meta</th><th class="num">Vistos</th><th>Resultado</th></tr></thead><tbody>${linhasMetas}</tbody></table></div>
    </section>` : ''}`;
}

/* ===== Busca ===== */

function nomeDaPrevia(p) {
  return dados.preferencias.nomes === 'original' && p.original ? p.original : p.titulo;
}

function titulosRecentes(limite) {
  const vistos = new Set();
  const lista = [];
  for (const { r, t } of registrosComTitulo().sort((a, b) => compararRegistros(a.r, b.r))) {
    if (vistos.has(t.id)) continue;
    vistos.add(t.id);
    lista.push(t);
    if (lista.length >= limite) break;
  }
  return lista;
}

function abrirBusca({ modo = 'registrar', religar = null, termo } = {}) {
  const b = estado.busca;
  b.modo = modo;
  b.religar = religar;
  if (modo === 'religar' && termo === undefined) {
    const t = tituloPorId(religar);
    termo = t ? `${t.original || t.titulo}${t.ano ? ` ${t.ano}` : ''}` : '';
    b.tipo = t ? t.tipo : '';
  }
  if (termo !== undefined) { b.termo = termo; b.resultados = null; b.erro = ''; }
  estado.formulario = null;
  estado.fichaAberta = null;
  const tipos = [['', 'Tudo'], ['filme', 'Filmes'], ['serie', 'Séries']];
  abrirModal({
    classe: 'tela-cheia busca-modal',
    topo: `<div class="busca-cabecalho"><div class="busca-topo">
        <button type="button" class="botao-icone" data-acao="fechar-modal" aria-label="Fechar">${icone('voltar', 24)}</button>
        <input type="search" data-busca-tmdb value="${esc(b.termo)}" placeholder="${modo === 'religar' ? 'Buscar o título certo' : 'Buscar filme ou série'}" aria-label="Buscar filme ou série" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="busca-tipo"><div class="segmentado" role="group" aria-label="Tipo">${tipos.map(([v, r]) => `<button type="button" data-acao="tipo-busca" data-valor="${v}" aria-pressed="${b.tipo === v}">${r}</button>`).join('')}</div></div></div>`,
    corpo: `<div data-busca-conteudo>${conteudoBusca()}</div>`,
  });
  const campo = document.querySelector('[data-busca-tmdb]');
  if (campo && chaveTMDB() && !b.termo.trim()) campo.focus({ preventScroll: true });
  if (!b.termo.trim()) carregarVitrineNaBusca();
  else if (!b.resultados) executarBusca();
}

function botaoManualHTML() {
  if (estado.busca.modo === 'religar') return '';
  return '<div class="acoes" style="margin-top:22px"><button type="button" class="botao pequeno" data-acao="registro-manual">Não achou? Cadastrar à mão</button></div>';
}

function conteudoBusca() {
  const b = estado.busca;
  if (!chaveTMDB()) return cartaoChaveHTML({ contexto: 'busca' }) + botaoManualHTML();
  if (!b.termo.trim()) return vitrineHTML() + botaoManualHTML();
  if (b.erro) return `<p class="estado-busca">${esc(b.erro)}</p>${botaoManualHTML()}`;
  if (!b.resultados) return b.carregando ? '<p class="estado-busca">Buscando…</p>' : '';
  if (!b.resultados.length) {
    return `<p class="estado-busca">Nada encontrado para “${esc(b.termo.trim())}”. Tente o título original ou acrescente o ano, como em “Duna 2021”.</p>${botaoManualHTML()}`;
  }
  return `<ul class="resultados">${b.resultados.map(resultadoHTML).join('')}</ul>${botaoManualHTML()}`;
}

function resultadoHTML(p, i) {
  const existente = tituloDoTmdb(p.tipo, p.tmdb);
  const vezes = existente ? registrosDe(existente.id).length : 0;
  const principal = nomeDaPrevia(p);
  const segundo = principal === p.titulo ? p.original : p.titulo;
  const mostrarSegundo = segundo && chaveTexto(segundo) !== chaveTexto(principal);
  return `<li class="linha-resultado"><button type="button" class="resultado" data-acao="escolher-resultado" data-lista="resultados" data-indice="${i}">
    ${posterHTML({ ...p, id: `tmdb-${p.tipo}-${p.tmdb}` }, { tamanho: 'w92', dobro: 'w185' })}
    <span>
      <span class="resultado-titulo">${esc(principal)}${p.ano ? `<span class="ano">${p.ano}</span>` : ''}</span>
      <span class="detalhe" style="display:block"><span class="tipo-selo">${p.tipo === 'serie' ? 'Série' : 'Filme'}</span>${mostrarSegundo ? esc(segundo) : ''}</span>
    </span>
    ${vezes ? `<span class="visto-selo">${icone('check', 15, { traco: 2.4 })}${vezes > 1 ? `${vezes}×` : 'Visto'}</span>` : ''}
  </button>${estado.busca.modo === 'religar' ? '' : botaoQueroVerPrevia(p, 'resultados', i)}</li>`;
}

function vitrineHTML() {
  const b = estado.busca;
  if (b.modo === 'religar') return '';
  const recentes = titulosRecentes(12);
  const doDiario = recentes.length ? `<section class="bloco-busca"><h3>Do seu diário</h3><div class="fila">${recentes.map(t => `<button type="button" class="tile" data-acao="registrar-titulo" data-id="${esc(t.id)}" aria-label="Registrar ${esc(nomeDe(t))} de novo">${posterHTML(t)}<span class="tile-nome">${esc(nomeDe(t))}</span></button>`).join('')}</div></section>` : '';
  const v = b.vitrine;
  const fila = (lista, nome) => `<div class="fila">${lista.map((p, i) => `<div class="tile-vitrine"><button type="button" class="tile" data-acao="escolher-resultado" data-lista="${nome}" data-indice="${i}" aria-label="${esc(nomeDaPrevia(p))}${p.ano ? `, ${p.ano}` : ''}">${posterHTML({ ...p, id: `tmdb-${p.tipo}-${p.tmdb}` })}<span class="tile-nome">${esc(nomeDaPrevia(p))}</span></button>${botaoQueroVerPrevia(p, nome, i, 'botao-quero mini')}</div>`).join('')}</div>`;
  let blocos = '';
  if (v) {
    if (v.cartaz.length) blocos += `<section class="bloco-busca"><h3>Nos cinemas</h3>${fila(v.cartaz, 'cartaz')}</section>`;
    if (v.alta.length) blocos += `<section class="bloco-busca"><h3>Em alta esta semana</h3>${fila(v.alta, 'alta')}</section>`;
  } else if (b.erroVitrine) {
    blocos = `<p class="estado-busca">${esc(b.erroVitrine)}</p>`;
  } else if (b.carregandoVitrine) {
    blocos = '<p class="estado-busca">Carregando o que está nos cinemas…</p>';
  }
  return doDiario + blocos;
}

function botaoQueroVerPrevia(p, lista, indice, classe = 'botao-quero') {
  const t = tituloDoTmdb(p.tipo, p.tmdb);
  const ligado = !!(t && t.querVer);
  const rotulo = ligado ? 'Tirar do Quero ver' : 'Quero ver';
  return `<button type="button" class="${classe}" data-acao="quero-ver-previa" data-lista="${lista}" data-indice="${indice}" aria-pressed="${ligado}" aria-label="${rotulo}: ${esc(nomeDaPrevia(p))}" title="${rotulo}">${icone('querover', classe.includes('mini') ? 18 : 21)}</button>`;
}

function marcarBotoesQueroVer(tipo, tmdb, ligado) {
  document.querySelectorAll('[data-acao="quero-ver-previa"]').forEach(b => {
    const p = previaDaLista(b.dataset.lista, Number(b.dataset.indice));
    if (!p || p.tipo !== tipo || p.tmdb !== tmdb) return;
    const rotulo = ligado ? 'Tirar do Quero ver' : 'Quero ver';
    b.setAttribute('aria-pressed', String(ligado));
    b.setAttribute('aria-label', `${rotulo}: ${nomeDaPrevia(p)}`);
    b.title = rotulo;
  });
}

function alternarQueroVerPrevia(lista, indice) {
  const p = previaDaLista(lista, indice);
  if (!p) return;
  let t = tituloDoTmdb(p.tipo, p.tmdb);
  const ligar = !(t && t.querVer);
  const nome = t ? nomeDe(t) : nomeDaPrevia(p);
  alterar(() => {
    if (!t) {
      t = normalizarTitulo({ ...p, id: novoId('t'), criadoEm: new Date().toISOString() });
      dados.titulos.push(t);
    }
    t.querVer = ligar;
    t.querVerEm = ligar ? hojeISO() : null;
    if (!ligar && tituloSolto(t)) dados.titulos = dados.titulos.filter(x => x !== t);
  }, { mensagem: ligar ? `${nome} está no Quero ver.` : `${nome} saiu do Quero ver.` });
  marcarBotoesQueroVer(p.tipo, p.tmdb, ligar);
  if (ligar) setTimeout(atualizarDisponibilidade, 300);
}

function alternarQueroVer(id, botao) {
  const t = tituloPorId(id);
  if (!t) return;
  const ligar = !t.querVer;
  alterar(() => {
    t.querVer = ligar;
    t.querVerEm = ligar ? hojeISO() : null;
  }, { mensagem: ligar ? `${nomeDe(t)} está no Quero ver.` : `${nomeDe(t)} saiu do Quero ver.` });
  if (botao) {
    const rotulo = ligar ? 'Tirar do Quero ver' : 'Quero ver';
    botao.setAttribute('aria-pressed', String(ligar));
    botao.setAttribute('aria-label', rotulo);
    botao.title = rotulo;
  }
  if (ligar) setTimeout(atualizarDisponibilidade, 300);
}

function atualizarConteudoBusca() {
  const alvo = document.querySelector('#modal [data-busca-conteudo]');
  if (alvo) alvo.innerHTML = conteudoBusca();
}

async function carregarVitrineNaBusca() {
  const b = estado.busca;
  if (!chaveTMDB() || b.modo === 'religar') return;
  if (b.vitrine && Date.now() - b.vitrine.em < 3600000) return;
  b.carregandoVitrine = true;
  b.erroVitrine = '';
  atualizarConteudoBusca();
  try {
    await carregarVitrine();
  } catch (e) {
    b.erroVitrine = explicarErroTMDB(e);
  }
  b.carregandoVitrine = false;
  if (!b.termo.trim()) atualizarConteudoBusca();
}

async function executarBusca() {
  const b = estado.busca;
  const termo = b.termo.trim();
  const pedido = ++b.pedido;
  if (!termo) {
    b.resultados = null;
    b.erro = '';
    atualizarConteudoBusca();
    carregarVitrineNaBusca();
    return;
  }
  b.carregando = true;
  b.erro = '';
  if (!b.resultados) atualizarConteudoBusca();
  try {
    const resultados = await buscarNoTMDB(termo, b.tipo);
    if (pedido !== b.pedido) return;
    b.resultados = resultados;
  } catch (e) {
    if (pedido !== b.pedido) return;
    b.erro = explicarErroTMDB(e);
    b.resultados = null;
  }
  b.carregando = false;
  atualizarConteudoBusca();
}

function previaDaLista(lista, indice) {
  const b = estado.busca;
  const fonte = lista === 'cartaz' ? (b.vitrine || {}).cartaz : lista === 'alta' ? (b.vitrine || {}).alta : b.resultados;
  return fonte ? fonte[indice] : null;
}

function escolherResultado(lista, indice) {
  const previa = previaDaLista(lista, indice);
  if (!previa) return;
  if (estado.busca.modo === 'religar') { religarTitulo(estado.busca.religar, previa); return; }
  const existente = tituloDoTmdb(previa.tipo, previa.tmdb);
  abrirFormularioRegistro({ previa, tituloId: existente ? existente.id : null, emCartaz: lista === 'cartaz', veioDaBusca: true });
}

/* ===== Formulário de registro ===== */

function metaLinha(base) {
  const partes = [];
  if (base.tipo === 'serie') {
    if (base.ano) partes.push(base.fim && base.fim !== base.ano ? `${base.ano}–${base.fim}` : String(base.ano));
    const n = temporadasReais(base).length;
    if (n) partes.push(plural(n, 'temporada', 'temporadas'));
  } else if (base.ano) {
    partes.push(String(base.ano));
  }
  if (base.direcao && base.direcao.length) partes.push(`de ${juntarNomes(base.direcao.slice(0, 2))}`);
  if (base.tipo === 'filme' && base.duracao) partes.push(duracaoTexto(base.duracao));
  return partes.join(', ');
}

function notaEntradaHTML(nota) {
  const v = Number(nota) || 0;
  return `<div class="nota-entrada" data-nota-entrada>
    <input type="hidden" name="nota" value="${v || ''}">
    <span class="nota-alvo" data-nota-alvo>
      <span class="estrelas" style="--v:${v}"></span>
      <span class="nota-botoes">${Array.from({ length: 10 }, (_, i) => `<button type="button" data-acao="nota" data-valor="${(i + 1) / 2}" aria-label="Nota ${notaTexto((i + 1) / 2)}"></button>`).join('')}</span>
    </span>
    <span class="nota-texto${v ? ' tem' : ''}" data-nota-texto>${v ? notaTexto(v) : 'sem nota'}</span>
  </div>`;
}

function definirNota(caixa, valor) {
  const v = notaValida(valor) || 0;
  caixa.querySelector('[name="nota"]').value = v || '';
  caixa.querySelector('.estrelas').style.setProperty('--v', v);
  const textoNota = caixa.querySelector('[data-nota-texto]');
  textoNota.textContent = v ? notaTexto(v) : 'sem nota';
  textoNota.classList.toggle('tem', !!v);
}

function chipsOndeHTML(selecionado, disponiveis = new Set()) {
  return `<div class="chips pequenos" role="radiogroup" aria-label="Onde assistiu">${dados.plataformas.map(p => `<label class="chip" style="--cor:${corSegura(p.cor)}"><input type="radio" name="onde" value="${esc(p.id)}"${p.id === selecionado ? ' checked' : ''}><span class="ponto"></span>${esc(p.nome)}${disponiveis.has(p.id) ? '<span class="disponivel" title="Disponível agora"></span>' : ''}</label>`).join('')}</div>`;
}

function opcoesTemporadasHTML(base, selecionada) {
  const reais = temporadasReais(base);
  const lista = reais.length
    ? reais.map(s => [String(s.n), `Temporada ${s.n}`])
    : Array.from({ length: Math.max(12, selecionada || 1) }, (_, i) => [String(i + 1), `Temporada ${i + 1}`]);
  if (selecionada && !lista.some(o => o[0] === String(selecionada))) lista.push([String(selecionada), `Temporada ${selecionada}`]);
  return opcoesHTML([...lista, ['completa', 'Série completa']], selecionada === null ? 'completa' : String(selecionada));
}

function resumoGeneros(generos) {
  return generos.length ? generos.map(g => GENERO_ROTULO[g]).join(', ') : 'nenhum';
}

function serieBase(f) {
  const t = f.tituloId ? tituloPorId(f.tituloId) : null;
  const meta = f.meta || {};
  return {
    ...(t || {}),
    id: t ? t.id : '__novo',
    tipo: 'serie',
    temporadas: (meta.temporadas && meta.temporadas.length) ? normalizarTitulo({ tipo: 'serie', temporadas: meta.temporadas }).temporadas : ((t && t.temporadas) || []),
    statusTMDB: meta.statusTMDB || (t && t.statusTMDB) || '',
  };
}

function abrirFormularioRegistro({ previa = null, tituloId = null, registroId = null, emCartaz = false, veioDaBusca = false, temporada, manual = false, voltarFicha = null } = {}) {
  const t = tituloId ? tituloPorId(tituloId) : null;
  const r = registroId ? registroPorId(registroId) : null;
  const base = t || previa || { tipo: 'filme', titulo: '', ano: null, generos: [], direcao: [] };
  const tipo = base.tipo;
  const f = estado.formulario = {
    tipo: 'registro', tituloId: t ? t.id : null, registroId: r ? r.id : null,
    meta: previa && !t ? { ...previa } : null, emCartaz, veioDaBusca, manual, voltarFicha,
    tmdb: (t && t.tmdb) || (previa && previa.tmdb) || null, tipoTitulo: tipo,
    ondeTocado: !!r, generosTocados: false, situacaoTocada: false, temporadaTocada: temporada !== undefined || !!r, revistoTocado: !!r,
  };
  estado.fichaAberta = null;
  const hoje = hojeISO();
  const ontem = ontemISO();
  const data = r ? r.data : hoje;
  const quando = !data ? 'sem' : data === hoje ? 'hoje' : data === ontem ? 'ontem' : 'outra';
  const onde = r ? r.onde : sugestaoDeOnde(f.meta, { emCartaz });
  const generos = [...(base.generos || [])];
  const temporadaInicial = r ? r.temporada : (temporada !== undefined ? temporada : (t ? proximaTemporada(t) : 1));
  const revisto = r ? r.revisto : !!(t && (tipo === 'filme' ? registrosDe(t.id).length : temporadasVistas(t).has(temporadaInicial)));
  const situacao = t && t.situacao && (r || revisto) ? t.situacao : situacaoDepoisDe(tipo === 'serie' ? serieBase(f) : base, temporadaInicial);
  const favorito = !!(t && t.favorito);
  const nota = r ? r.nota : null;
  const tituloJanela = r ? 'Editar registro' : manual ? 'Cadastrar à mão' : 'Registrar';
  const voltar = veioDaBusca || manual
    ? `<button type="button" class="voltar" data-acao="voltar-busca">${icone('voltar', 18, { traco: 2.2 })}Busca</button>`
    : voltarFicha ? `<button type="button" class="voltar" data-acao="abrir-titulo" data-id="${esc(voltarFicha)}">${icone('voltar', 18, { traco: 2.2 })}Voltar</button>` : '';
  const topo = `<div class="modal-cabecalho">${voltar}<h2 class="modal-titulo" style="${voltar ? 'font-size:22px;margin-left:4px' : ''}">${tituloJanela}</h2><button type="button" class="botao-icone" data-acao="fechar-modal" aria-label="Fechar">${icone('fechar')}</button></div>`;

  const cabecalho = manual
    ? `<div class="campos">
        <label class="campo c6"><span>Título</span><input type="text" name="m-titulo" required autocomplete="off"></label>
        <label class="campo c2"><span>Ano</span><input type="number" name="m-ano" min="1870" max="2100" inputmode="numeric"></label>
        <div class="campo c4"><span>Tipo</span><div class="chips pequenos" role="radiogroup" aria-label="Tipo"><label class="chip"><input type="radio" name="m-tipo" value="filme" checked>Filme</label><label class="chip"><input type="radio" name="m-tipo" value="serie">Série</label></div></div>
      </div>`
    : `<div class="registro-topo">
        ${posterHTML(base, { caminho: r ? posterDoRegistro(r, base) : base.poster, tamanho: 'w154', dobro: 'w342' })}
        <div><h2 class="registro-titulo">${esc(nomeDe(base))}</h2><p class="registro-meta" data-registro-meta>${esc(metaLinha(base))}</p></div>
      </div>`;

  const blocoSerie = `<fieldset class="bloco-form" data-bloco-serie${tipo === 'serie' ? '' : ' hidden'}><legend>O que você viu</legend>
      <div class="linha-dupla">
        <label class="campo"><span>Temporada</span><select name="temporada" data-temporadas>${opcoesTemporadasHTML(tipo === 'serie' ? serieBase(f) : { temporadas: [] }, temporadaInicial)}</select></label>
        <label class="campo"><span>A série fica</span><select name="situacao">${opcoesHTML(SITUACOES, situacao)}</select></label>
      </div>
    </fieldset>`;

  const corpo = `${cabecalho}
    ${blocoSerie}
    <fieldset class="bloco-form"><legend data-legenda-quando>${tipo === 'serie' ? 'Quando você terminou' : 'Quando você assistiu'}</legend>
      <div class="chips pequenos" role="radiogroup" aria-label="Quando">${[['hoje', 'Hoje'], ['ontem', 'Ontem'], ['outra', 'Outro dia'], ['sem', 'Não lembro']].map(([v, rotulo]) => `<label class="chip"><input type="radio" name="quando" value="${v}"${quando === v ? ' checked' : ''}>${rotulo}</label>`).join('')}</div>
      <label class="campo campo-data" data-campo-data${quando === 'outra' ? '' : ' hidden'}><span>Data</span><input type="date" name="data" value="${esc(quando === 'outra' ? data : '')}" max="${hoje}"></label>
    </fieldset>
    <fieldset class="bloco-form"><legend>Nota</legend>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        ${notaEntradaHTML(nota)}
        <input type="hidden" name="favorito" value="${favorito ? '1' : ''}">
        <button type="button" class="botao-coracao" data-acao="favorito-form" aria-pressed="${favorito}" aria-label="Favorito" title="Favorito">${icone('coracao', 22)}</button>
      </div>
    </fieldset>
    <fieldset class="bloco-form"><legend>Onde assistiu</legend>
      <div data-chips-onde>${chipsOndeHTML(onde, plataformasDisponiveis(f.meta))}</div>
      <p class="aviso-disponivel" data-disponivel>${esc(textoDisponibilidade(f.meta))}</p>
    </fieldset>
    <label class="opcao-check"><input type="checkbox" name="revisto"${revisto ? ' checked' : ''}> Já tinha visto antes (revisão)</label>
    <details class="bloco-form generos-form"${manual || !generos.length ? ' open' : ''}>
      <summary><span class="legenda">Gêneros</span><span data-resumo-generos>${esc(resumoGeneros(generos))}</span><span class="editar">Editar</span></summary>
      <div class="chips pequenos" data-chips-generos>${GENEROS.map(([id, nome]) => `<label class="chip"><input type="checkbox" name="genero" value="${id}"${generos.includes(id) ? ' checked' : ''}>${nome}</label>`).join('')}</div>
    </details>
    <label class="bloco-form campo"><span class="legenda">Comentário</span><textarea name="comentario" rows="3" placeholder="O que achou? Opcional.">${esc(r ? r.comentario : '')}</textarea></label>
    <p class="mensagem-erro" data-erro-form aria-live="assertive"></p>`;

  const rodape = r
    ? `<button type="button" class="botao perigo esquerda" data-acao="excluir-registro" data-id="${esc(r.id)}">Excluir</button><button type="button" class="botao" data-acao="fechar-modal">Cancelar</button><button type="submit" class="botao primario">Salvar</button>`
    : `<button type="button" class="botao esquerda" data-acao="so-assistindo"${tipo === 'serie' ? '' : ' hidden'}>Estou assistindo</button><button type="submit" class="botao primario">Registrar</button>`;

  abrirModal({ classe: 'tela-cheia registro-modal', topo, corpo, rodape, formulario: 'registro' });
  if (manual) setTimeout(() => { const c = document.querySelector('[name="m-titulo"]'); if (c) c.focus(); }, 60);
  if (f.tmdb && chaveTMDB() && (!t || !t.tmdbEm || diasEntre(t.tmdbEm, hojeISO()) > 20 || !r)) carregarDetalhesDoFormulario(f);
}

async function carregarDetalhesDoFormulario(f) {
  let meta;
  try {
    meta = await detalhesDoTMDB(f.tipoTitulo, f.tmdb);
  } catch (e) {
    return;
  }
  if (!meta || estado.formulario !== f) return;
  f.meta = meta;
  const form = document.querySelector('#modal form[data-form="registro"]');
  if (!form) return;
  const t = f.tituloId ? tituloPorId(f.tituloId) : null;
  const linha = form.querySelector('[data-registro-meta]');
  if (linha) linha.textContent = metaLinha({ ...(t || {}), ...meta, direcao: meta.direcao.length ? meta.direcao : ((t && t.direcao) || []) });
  const alvoOnde = form.querySelector('[data-chips-onde]');
  let sugerida = '';
  if (alvoOnde) {
    let selecionado = (form.querySelector('[name="onde"]:checked') || {}).value || '';
    if (!f.ondeTocado && !f.registroId) {
      sugerida = sugestaoDeOnde(meta, { emCartaz: f.emCartaz });
      if (sugerida) selecionado = sugerida;
    }
    alvoOnde.innerHTML = chipsOndeHTML(selecionado, plataformasDisponiveis(meta));
  }
  const aviso = form.querySelector('[data-disponivel]');
  if (aviso) {
    const texto = textoDisponibilidade(meta);
    const p = sugerida ? plataformaPorId(sugerida) : null;
    aviso.textContent = p && sugerida !== 'cinema' && texto ? `${texto} ${p.nome} ficou marcado; troque se viu em outro lugar.` : p && sugerida === 'cinema' ? `Estreou nos cinemas há pouco, por isso Cinema ficou marcado.${texto ? ` ${texto}` : ''}` : texto;
  }
  if (!f.generosTocados && !(t && t.generosManual) && meta.generos.length) {
    form.querySelectorAll('[name="genero"]').forEach(c => { c.checked = meta.generos.includes(c.value); });
    const resumo = form.querySelector('[data-resumo-generos]');
    if (resumo) resumo.textContent = resumoGeneros(meta.generos);
  }
  if (f.tipoTitulo === 'serie') {
    const base = serieBase(f);
    const seletor = form.querySelector('[data-temporadas]');
    if (seletor) {
      const atual = seletor.value === 'completa' ? null : Number(seletor.value);
      const escolhida = f.temporadaTocada ? atual : proximaTemporada(base);
      seletor.innerHTML = opcoesTemporadasHTML(base, escolhida);
      atualizarSituacaoSugerida(form);
    }
  }
}

function atualizarSituacaoSugerida(form) {
  const f = estado.formulario;
  if (!f || f.tipoTitulo !== 'serie') return;
  const seletor = form.querySelector('[data-temporadas]');
  const temporada = seletor.value === 'completa' ? null : Number(seletor.value);
  const t = f.tituloId ? tituloPorId(f.tituloId) : null;
  if (!f.revistoTocado && !f.registroId) {
    const caixa = form.querySelector('[name="revisto"]');
    if (caixa) caixa.checked = !!(t && temporadasVistas(t).has(temporada));
  }
  if (!f.situacaoTocada && !f.registroId) {
    const campo = form.querySelector('[name="situacao"]');
    if (campo) campo.value = situacaoDepoisDe(serieBase(f), temporada);
  }
}

function lerFormularioRegistro(form) {
  const f = estado.formulario;
  const valor = nome => ((form.querySelector(`[name="${nome}"]`) || {}).value || '').trim();
  const quando = (form.querySelector('[name="quando"]:checked') || {}).value || 'hoje';
  let data = null;
  if (quando === 'hoje') data = hojeISO();
  else if (quando === 'ontem') data = ontemISO();
  else if (quando === 'outra') {
    data = valor('data');
    if (!dataValida(data)) return { erro: 'Escolha a data em que você assistiu.', campo: 'data' };
  }
  if (data && data > hojeISO()) return { erro: 'A data não pode ser depois de hoje.', campo: 'data' };
  let tipo = f.tipoTitulo;
  let manual = null;
  if (f.manual) {
    const titulo = valor('m-titulo');
    if (!titulo) return { erro: 'Escreva o título.', campo: 'm-titulo' };
    tipo = (form.querySelector('[name="m-tipo"]:checked') || {}).value || 'filme';
    manual = { titulo, ano: inteiroOuNulo(valor('m-ano'), 1870, 2200), tipo };
  }
  const seletor = form.querySelector('[name="temporada"]');
  const temporada = tipo === 'serie' && seletor ? (seletor.value === 'completa' ? null : inteiroOuNulo(seletor.value, 1, 500)) : null;
  return {
    data,
    nota: notaValida(valor('nota')),
    favorito: valor('favorito') === '1',
    onde: (form.querySelector('[name="onde"]:checked') || {}).value || '',
    generos: [...form.querySelectorAll('[name="genero"]:checked')].map(c => c.value),
    comentario: (form.querySelector('[name="comentario"]').value || '').trim(),
    revisto: form.querySelector('[name="revisto"]').checked,
    temporada,
    situacao: tipo === 'serie' ? valor('situacao') : '',
    tipo,
    manual,
  };
}

function salvarRegistro(form, { soAssistindo = false } = {}) {
  const f = estado.formulario;
  if (!f || f.tipo !== 'registro') return;
  const erroEl = form.querySelector('[data-erro-form]');
  erroEl.textContent = '';
  const v = lerFormularioRegistro(form);
  if (v.erro) {
    erroEl.textContent = v.erro;
    const campo = v.campo && form.querySelector(`[name="${v.campo}"]`);
    if (campo) campo.focus();
    return;
  }
  const anoRegistro = (v.data || hojeISO()).slice(0, 4);
  const filmesAntes = filmesNoAno(anoRegistro);
  let t = null;
  let novoTitulo = false;
  let registroNovo = null;
  let terminou = false;
  let saiuDaLista = false;
  const situacaoAntes = f.tituloId ? (tituloPorId(f.tituloId) || {}).situacao : '';
  alterar(() => {
    t = f.tituloId ? tituloPorId(f.tituloId) : (f.tmdb ? tituloDoTmdb(f.tipoTitulo, f.tmdb) : null);
    if (!t) {
      const semente = v.manual ? { ...v.manual, generos: v.generos } : { ...(f.meta || {}) };
      t = normalizarTitulo({ ...semente, id: novoId('t'), criadoEm: new Date().toISOString() });
      if (!v.manual && f.meta) aplicarMeta(t, f.meta);
      dados.titulos.push(t);
      novoTitulo = true;
    } else if (f.meta && f.meta.completa) {
      aplicarMeta(t, f.meta);
    }
    const generosOriginais = (f.meta && f.meta.generos) || [];
    if (f.generosTocados) {
      t.generos = v.generos;
      t.generosManual = v.manual ? false : v.generos.join() !== generosOriginais.join();
    } else if (v.manual) {
      t.generos = v.generos;
    }
    t.favorito = v.favorito;
    if (t.querVer && !f.registroId) {
      t.querVer = false;
      t.querVerEm = null;
      saiuDaLista = true;
    }
    if (t.tipo === 'serie') {
      const antes = t.situacao;
      if (soAssistindo) t.situacao = f.situacaoTocada ? v.situacao : 'assistindo';
      else t.situacao = v.situacao || situacaoDepoisDe(t, v.temporada);
      terminou = t.situacao === 'terminada' && antes !== 'terminada' && situacaoAntes !== 'terminada';
    }
    if (soAssistindo) return;
    if (f.registroId) {
      const r = registroPorId(f.registroId);
      if (r) Object.assign(r, { data: v.data, nota: v.nota, onde: v.onde, temporada: t.tipo === 'serie' ? v.temporada : null, revisto: v.revisto, comentario: v.comentario });
    } else {
      registroNovo = normalizarRegistro({
        id: novoId('r'), titulo: t.id, data: v.data, nota: v.nota, onde: v.onde,
        temporada: t.tipo === 'serie' ? v.temporada : null, revisto: v.revisto, comentario: v.comentario,
        criadoEm: new Date().toISOString(),
      });
      dados.registros.push(registroNovo);
    }
  });
  const nome = nomeDe(t);
  const p = plataformaPorId(v.onde);
  if (f.voltarFicha || f.registroId) abrirFicha(t.id, { destaque: f.registroId || '' });
  else fecharModal();
  const avisoLista = saiuDaLista ? ' Saiu do Quero ver.' : '';
  if (soAssistindo) {
    avisar(`${nome} está em Assistindo agora.${avisoLista}`);
  } else if (f.registroId) {
    avisar('Registro atualizado.');
  } else {
    const onde = p ? (p.id === 'cinema' ? ' no cinema' : p.id === 'tv' ? ' na TV' : ` em ${p.nome}`) : '';
    const oque = t.tipo === 'serie' ? `${nome}, ${v.temporada ? `temporada ${v.temporada}` : 'série completa'},` : nome;
    const idRegistro = registroNovo.id;
    const idTitulo = t.id;
    avisar(`${oque} registrado${onde}.${avisoLista}`, { acao: 'Desfazer', fn: () => desfazerRegistro(idRegistro, novoTitulo ? idTitulo : null), tempo: 7000 });
  }
  if (!soAssistindo && !f.registroId) {
    comemorarSeFor({ t, data: v.data, filmesAntes, filmesDepois: filmesNoAno(anoRegistro), terminou, ano: anoRegistro });
  } else if (terminou) {
    comemorarSeFor({ t, terminou });
  }
}

function desfazerRegistro(idRegistro, idTituloNovo) {
  alterar(() => {
    dados.registros = dados.registros.filter(r => r.id !== idRegistro);
    if (idTituloNovo && !dados.registros.some(r => r.titulo === idTituloNovo)) dados.titulos = dados.titulos.filter(t => t.id !== idTituloNovo);
  }, { mensagem: 'Registro desfeito.' });
}

async function excluirRegistro(id) {
  const r = registroPorId(id);
  if (!r) return;
  const t = tituloPorId(r.titulo);
  const ok = await confirmar({
    titulo: 'Excluir registro',
    texto: `O registro de ${nomeDe(t)}${r.data ? ` em ${dataBR(r.data)}` : ''} sai do diário.`,
    ok: 'Excluir',
    perigo: true,
  });
  if (!ok) return;
  let saiuTitulo = false;
  alterar(() => {
    dados.registros = dados.registros.filter(x => x.id !== id);
    const sobra = dados.registros.some(x => x.titulo === t.id);
    if (!sobra && !t.querVer && !(t.tipo === 'serie' && ['assistindo', 'pausada'].includes(t.situacao))) {
      dados.titulos = dados.titulos.filter(x => x.id !== t.id);
      saiuTitulo = true;
    }
  }, { mensagem: 'Registro excluído.' });
  if (saiuTitulo) fecharModal();
  else abrirFicha(t.id);
}

/* ===== Ficha do título ===== */

function abrirFicha(id, { destaque = '' } = {}) {
  const t = tituloPorId(id);
  if (!t) { fecharModal(); return; }
  estado.formulario = null;
  estado.fichaAberta = id;
  const regs = registrosDe(t.id);
  const fundo = urlImagem(t.fundo, 'w780');
  const outro = outroNome(t);
  const partes = [];
  if (t.ano) partes.push(t.tipo === 'serie' && t.fim && t.fim !== t.ano ? `${t.ano}–${t.fim}` : String(t.ano));
  if (t.tipo === 'filme' && t.duracao) partes.push(duracaoTexto(t.duracao));
  if (t.tipo === 'serie') {
    const n = temporadasReais(t).length;
    if (n) partes.push(plural(n, 'temporada', 'temporadas'));
    if (t.duracao) partes.push(`episódios de ${duracaoTexto(t.duracao)}`);
  }
  partes.push(t.tipo === 'serie' ? 'Série' : 'Filme');
  const credito = t.direcao.length ? `${t.tipo === 'serie' ? 'Criação de' : 'Direção de'} ${juntarNomes(t.direcao)}` : '';
  const vezes = regs.length;
  const resumo = vezes ? (t.tipo === 'serie' ? plural(vezes, 'registro', 'registros') : vezes === 1 ? 'Visto uma vez' : `Visto ${vezes} vezes`)
    : t.querVer && t.querVerEm ? `No Quero ver desde ${dataBR(t.querVerEm)}` : '';

  let blocoSerie = '';
  if (t.tipo === 'serie') {
    const vistas = temporadasVistas(t);
    const reais = temporadasReais(t);
    const notaDa = n => { const r = regs.find(x => x.temporada === n && x.nota); return r ? r.nota : null; };
    blocoSerie = `<section class="ficha-bloco">
      <h3>Situação</h3>
      <div class="chips pequenos" role="group" aria-label="Situação da série">${SITUACOES.map(([valor, rotulo]) => `<button type="button" class="chip" data-acao="situacao-serie" data-id="${esc(t.id)}" data-valor="${valor}" aria-pressed="${t.situacao === valor}">${rotulo}</button>`).join('')}</div>
      ${t.situacao === 'em-dia' ? '<p class="ajuda" style="margin-top:8px">Em dia: você viu tudo o que já estreou e está esperando a próxima temporada.</p>' : ''}
      ${reais.length ? `<ul class="lista-temporadas" style="margin-top:14px">${reais.map(s => `<li class="${vistas.has(s.n) ? 'vista' : ''}">
          <span class="marca-vista">${icone('check', 14, { traco: 2.6 })}</span>
          <div><p class="nome-temporada">Temporada ${s.n}</p><p class="detalhe">${[s.episodios ? plural(s.episodios, 'episódio', 'episódios') : '', s.data ? (temporadaJaExibida(s) ? s.data.slice(0, 4) : `estreia em ${dataBR(s.data)}`) : ''].filter(Boolean).join(', ')}</p></div>
          ${vistas.has(s.n) ? estrelasHTML(notaDa(s.n), 12) || `<button type="button" class="botao discreto pequeno" data-acao="registrar-temporada" data-id="${esc(t.id)}" data-temporada="${s.n}">Registrar</button>` : temporadaJaExibida(s) ? `<button type="button" class="botao pequeno" data-acao="registrar-temporada" data-id="${esc(t.id)}" data-temporada="${s.n}">Registrar</button>` : ''}
        </li>`).join('')}</ul>` : ''}
    </section>`;
  }

  const historico = regs.length
    ? `<ul class="historico">${regs.map(r => {
      const p = plataformaPorId(r.onde);
      const detalhes = [rotuloTemporada(r, t), p ? p.nome : '', r.revisto ? 'revisão' : ''].filter(Boolean).join(', ');
      return `<li data-acao="editar-registro" data-id="${esc(r.id)}" role="button" tabindex="0"${r.id === destaque ? ' class="destacado"' : ''}>
        <div>
          <p class="quando">${r.data ? esc(nomeProprio(dataExtensa(r.data))) : 'Sem data'}</p>
          ${detalhes ? `<p class="detalhe">${esc(detalhes)}</p>` : ''}
          ${r.comentario ? `<p class="comentario">${esc(r.comentario)}</p>` : ''}
          ${r.tags.length ? `<p class="detalhe">Tags: ${esc(r.tags.join(', '))}</p>` : ''}
        </div>
        <div class="historico-marcas">${estrelasHTML(r.nota, 13)}${r.revisto ? revistoMini(r) : ''}</div>
      </li>`;
    }).join('')}</ul>`
    : `<p class="vazio">${t.tipo === 'serie' ? 'Nenhuma temporada registrada ainda.' : 'Nenhum registro.'}</p>`;

  const links = [];
  if (t.tmdb) links.push(`<a href="https://www.themoviedb.org/${t.tipo === 'serie' ? 'tv' : 'movie'}/${t.tmdb}" target="_blank" rel="noopener noreferrer">TMDB</a>`);
  if (t.tmdb && t.tipo === 'filme') links.push(`<a href="https://letterboxd.com/tmdb/${t.tmdb}/" target="_blank" rel="noopener noreferrer">Letterboxd</a>`);
  if (t.imdb) links.push(`<a href="https://www.imdb.com/title/${esc(t.imdb)}/" target="_blank" rel="noopener noreferrer">IMDb</a>`);

  abrirModal({
    classe: 'tela-cheia ficha-modal',
    topo: `<div class="modal-cabecalho"><button type="button" class="botao-icone" data-acao="fechar-modal" aria-label="Fechar">${icone('fechar')}</button></div>`,
    corpo: `<div class="ficha-fundo${fundo ? '' : ' sem-fundo'}"${fundo ? ` style="--fundo:url('${esc(fundo)}')"` : ''}></div>
      <div class="ficha-miolo">
        <div class="ficha-cabecalho">
          <div class="ficha-poster">${posterHTML(t, { tamanho: 'w342', dobro: 'w500' })}</div>
          <div>
            <h2 class="ficha-titulo">${esc(nomeDe(t))}</h2>
            ${outro ? `<p class="ficha-original">${esc(outro)}</p>` : ''}
            <p class="ficha-meta">${partes.map(p => `<span>${esc(p)}</span>`).join('')}</p>
          </div>
        </div>
        ${credito ? `<p class="detalhe" style="margin-top:14px">${esc(credito)}</p>` : ''}
        <div class="ficha-acoes">
          <button type="button" class="botao primario" data-acao="registrar-titulo" data-id="${esc(t.id)}">${icone('mais', 18, { traco: 2.4 })}${vezes ? 'Registrar de novo' : 'Registrar'}</button>
          <button type="button" class="botao-coracao" data-acao="alternar-favorito" data-id="${esc(t.id)}" aria-pressed="${t.favorito}" aria-label="Favorito" title="${t.favorito ? 'Tirar dos favoritos' : 'Marcar como favorito'}">${icone('coracao', 22)}</button>
          <button type="button" class="botao-quero grande" data-acao="alternar-quero-ver" data-id="${esc(t.id)}" aria-pressed="${t.querVer}" aria-label="${t.querVer ? 'Tirar do Quero ver' : 'Quero ver'}" title="${t.querVer ? 'Tirar do Quero ver' : 'Quero ver'}">${icone('querover', 21)}</button>
          ${resumo ? `<span class="detalhe">${esc(resumo)}</span>` : ''}
        </div>
        ${t.generos.length ? `<div class="chips ficha-generos">${t.generos.map(g => `<span class="chip">${esc(GENERO_ROTULO[g])}</span>`).join('')}</div>` : ''}
        ${blocoSerie}
        <section class="ficha-bloco"><h3>No seu diário</h3>${historico}</section>
        ${t.sinopse ? `<section class="ficha-bloco"><h3>Sinopse</h3><p class="sinopse${t.sinopse.length > 280 ? ' cortada' : ''}" data-sinopse>${esc(t.sinopse)}</p>${t.sinopse.length > 280 ? '<button type="button" class="link" data-acao="mostrar-sinopse" style="margin-top:6px">Ler tudo</button>' : ''}</section>` : ''}
        ${t.elenco.length ? `<section class="ficha-bloco"><h3>Elenco</h3><p class="detalhe">${esc(juntarNomes(t.elenco))}</p></section>` : ''}
        <section class="ficha-bloco" data-onde-assistir hidden><h3>Onde assistir no Brasil</h3><div data-provedores></div><p class="ajuda" style="margin-top:10px">Dados da JustWatch, via TMDB.</p></section>
        ${links.length ? `<p class="links-externos">${links.join('')}</p>` : ''}
      </div>`,
    rodape: `<button type="button" class="botao perigo esquerda" data-acao="excluir-titulo" data-id="${esc(t.id)}">Excluir</button><button type="button" class="botao" data-acao="editar-titulo" data-id="${esc(t.id)}">Editar dados</button>`,
  });
  const alvo = destaque && document.querySelector('#modal .historico .destacado');
  if (alvo) alvo.scrollIntoView({ block: 'nearest' });
  carregarOndeAssistir(t);
}

async function carregarOndeAssistir(t) {
  if (!t.tmdb || !chaveTMDB() || !navigator.onLine) return;
  let meta;
  try {
    meta = await detalhesDoTMDB(t.tipo, t.tmdb);
  } catch (e) {
    return;
  }
  if (!meta) return;
  const hoje = hojeISO();
  const precisaMeta = !t.tmdbEm || diasEntre(t.tmdbEm, hoje) >= 30;
  const precisaLugar = t.querVer && t.disponivelEm !== hoje;
  if (precisaMeta || precisaLugar) {
    alterar(() => {
      if (precisaMeta) aplicarMeta(t, meta);
      if (t.querVer) {
        t.disponivel = disponibilidadeDe(meta);
        t.disponivelEm = hoje;
      }
    });
  }
  if (estado.fichaAberta !== t.id) return;
  const bloco = document.querySelector('#modal [data-onde-assistir]');
  if (!bloco) return;
  const prov = meta.provedores;
  const linha = (lista, rotulo) => (lista.length ? `<p class="rotulo" style="margin:4px 0 8px">${rotulo}</p><div class="provedores">${lista.map(p => `<span class="provedor">${p.logo ? `<img src="${esc(TMDB_IMG + 'w92' + p.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}${esc(p.nome)}</span>`).join('')}</div>` : '');
  const html = linha(prov.assinatura, 'Incluído na assinatura ou grátis') + (prov.aluguel.length ? `<div style="margin-top:12px">${linha(prov.aluguel.slice(0, 6), 'Para alugar ou comprar')}</div>` : '');
  if (!html) return;
  bloco.querySelector('[data-provedores]').innerHTML = html;
  bloco.hidden = false;
}

async function excluirTitulo(id) {
  const t = tituloPorId(id);
  if (!t) return;
  const n = registrosDe(t.id).length;
  const ok = await confirmar({
    titulo: 'Excluir do diário',
    texto: `${nomeDe(t)} sai da cinemateca${n ? `, junto com ${plural(n, 'registro', 'registros')} do diário` : ''}.`,
    ok: 'Excluir',
    perigo: true,
  });
  if (!ok) return;
  fecharModal();
  alterar(() => {
    dados.registros = dados.registros.filter(r => r.titulo !== t.id);
    dados.titulos = dados.titulos.filter(x => x.id !== t.id);
  }, { mensagem: `${nomeDe(t)} excluído.` });
}

/* ===== Editar dados do título ===== */

function abrirEditarTitulo(id) {
  const t = tituloPorId(id);
  if (!t) return;
  estado.fichaAberta = null;
  estado.formulario = { tipo: 'titulo', tituloId: id, poster: t.poster, posterManual: t.posterManual };
  abrirModal({
    titulo: 'Editar dados',
    subtitulo: esc(nomeDe(t)),
    classe: 'tela-cheia',
    formulario: 'titulo',
    corpo: `<div class="edicao-poster">
        <div data-previa-poster>${posterHTML(t)}</div>
        <div>
          <div class="acoes" style="margin-top:0">
            <button type="button" class="botao pequeno" data-acao="escolher-poster">Escolher imagem</button>
            <button type="button" class="botao pequeno" data-acao="colar-poster">Colar imagem</button>
            ${t.tmdb ? '<button type="button" class="botao discreto pequeno" data-acao="poster-tmdb">Usar o pôster do TMDB</button>' : ''}
          </div>
          <input type="file" accept="image/*" data-arquivo-poster hidden>
          <p class="ajuda" data-poster-status style="margin-top:8px"></p>
        </div>
      </div>
      <div class="campos" style="margin-top:18px">
        <label class="campo c6"><span>Título</span><input type="text" name="titulo" value="${esc(t.titulo)}" required></label>
        <label class="campo c6"><span>Título original</span><input type="text" name="original" value="${esc(t.original)}"></label>
        <label class="campo c2"><span>Ano</span><input type="number" name="ano" value="${esc(t.ano ?? '')}" min="1870" max="2200" inputmode="numeric"></label>

function salvarTitulo(form) {
  const f = estado.formulario;
  const t = tituloPorId(f.tituloId);
  if (!t) return;
  const valor = nome => ((form.querySelector(`[name="${nome}"]`) || {}).value || '').trim();
  const titulo = valor('titulo');
  if (!titulo) { form.querySelector('[data-erro-form]').textContent = 'O título não pode ficar em branco.'; return; }
  const generos = [...form.querySelectorAll('[name="genero"]:checked')].map(c => c.value);
  const tipoNovo = t.tmdb ? t.tipo : (valor('tipo') || t.tipo);
  alterar(() => {
    if (titulo !== t.titulo) t.tituloManual = true;
    if (generos.join() !== t.generos.join()) t.generosManual = true;
    Object.assign(t, {
      titulo,
      original: valor('original'),
      ano: inteiroOuNulo(valor('ano'), 1870, 2200),
      duracao: inteiroOuNulo(valor('duracao'), 1, 2000),
      direcao: valor('direcao').split(',').map(n => n.trim()).filter(Boolean).slice(0, 6),
      generos,
      sinopse: (form.querySelector('[name="sinopse"]').value || '').trim(),
      poster: f.poster || '',
      posterManual: !!f.posterManual,
    });
    if (tipoNovo !== t.tipo) {
      t.tipo = tipoNovo;
      if (tipoNovo === 'filme') dados.registros.forEach(r => { if (r.titulo === t.id) r.temporada = null; });
      const i = dados.titulos.indexOf(t);
      dados.titulos[i] = normalizarTitulo(t);
    }
  }, { mensagem: 'Dados salvos.' });
  abrirFicha(t.id);
}

async function religarTitulo(tituloId, previa) {
  const t = tituloPorId(tituloId);
  if (!t) return;
  const outro = tituloDoTmdb(previa.tipo, previa.tmdb);
  if (outro && outro.id !== t.id) {
    const juntar = await confirmar({
      titulo: 'Esse título já está no diário',
      texto: `${nomeDe(outro)} já está na cinemateca. Os registros de ${nomeDe(t)} passam para ele, e o cadastro repetido sai.`,
      ok: 'Juntar os dois',
    });
    if (!juntar) return;
    alterar(() => {
      dados.registros.forEach(r => { if (r.titulo === t.id) { r.titulo = outro.id; if (outro.tipo === 'filme') r.temporada = null; } });
      if (t.favorito) outro.favorito = true;
      dados.titulos = dados.titulos.filter(x => x.id !== t.id);
    }, { mensagem: 'Registros juntados.' });
    abrirFicha(outro.id);
    return;
  }
  let meta = previa;
  try { meta = (await detalhesDoTMDB(previa.tipo, previa.tmdb)) || previa; } catch (e) { /* segue com a prévia */ }
  alterar(() => {
    if (t.tipo !== meta.tipo) {
      t.tipo = meta.tipo;
      if (meta.tipo === 'filme') dados.registros.forEach(r => { if (r.titulo === t.id) r.temporada = null; });
    }
    aplicarMeta(t, meta, { forcar: true });
    t.tmdb = meta.tmdb;
    const i = dados.titulos.indexOf(t);
    dados.titulos[i] = normalizarTitulo(t);
  }, { mensagem: `${meta.titulo} ligado ao TMDB.` });
  abrirFicha(t.id);
}

function abrirSemTmdb() {
  const lista = dados.titulos.filter(t => !t.tmdb).sort((a, b) => colador.compare(nomeDe(a), nomeDe(b)));
  abrirModal({
    titulo: 'Títulos sem ligação com o TMDB',
    subtitulo: plural(lista.length, 'título', 'títulos'),
    corpo: lista.length

}

/* ===== Pôster escolhido à mão ===== */

function reduzirImagem(origem) {
  return new Promise((ok, erro) => {
    const desenhar = src => {
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, 342 / img.width, 513 / img.height);
        const tela = document.createElement('canvas');
        tela.width = Math.max(1, Math.round(img.width * escala));
        tela.height = Math.max(1, Math.round(img.height * escala));
        const ctx = tela.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, tela.width, tela.height);
        ctx.drawImage(img, 0, 0, tela.width, tela.height);
        ok(tela.toDataURL('image/jpeg', 0.84));
      };
      img.onerror = () => erro(new Error('imagem inválida'));
      img.src = src;
    };
    if (typeof origem === 'string') { desenhar(origem); return; }
    const leitor = new FileReader();
    leitor.onload = () => desenhar(leitor.result);
    leitor.onerror = () => erro(leitor.error);
    leitor.readAsDataURL(origem);
  });
}

function imagemCarrega(url, tempo = 9000) {
  return new Promise(resolver => {
    const img = new Image();
    const timer = setTimeout(() => resolver(false), tempo);
    img.onload = () => { clearTimeout(timer); resolver(img.naturalWidth >= 40 && img.naturalHeight >= 40); };
    img.onerror = () => { clearTimeout(timer); resolver(false); };
    img.referrerPolicy = 'no-referrer';
    img.src = url;
  });
}

async function prepararImagem(conteudo) {
  if (typeof conteudo === 'string') {
    const texto = conteudo.trim();
    if (/^data:image\//i.test(texto)) return reduzirImagem(texto);
    if (!urlSegura(texto) || !(await imagemCarrega(texto))) throw new Error('imagem inválida');
    return texto;
  }
  if (!conteudo || !String(conteudo.type || '').startsWith('image/')) throw new Error('não é imagem');
  return reduzirImagem(conteudo);
}

async function lerAreaDeTransferencia() {
  if (!navigator.clipboard || !navigator.clipboard.read) throw new Error('sem suporte');
  const itens = await navigator.clipboard.read();
  for (const item of itens) {
    const tipo = item.types.find(x => x.startsWith('image/'));
    if (tipo) return item.getType(tipo);
  }
  for (const item of itens) {
    if (item.types.includes('text/plain')) {
      const texto = (await (await item.getType('text/plain')).text()).trim();
      if (/^(https:\/\/\S+|data:image\/\S+)$/i.test(texto)) return texto;
    }
  }
  return null;
}

async function aplicarPosterNoFormulario(conteudo) {
  const f = estado.formulario;
  const status = document.querySelector('[data-poster-status]');
