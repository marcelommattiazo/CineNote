const MARCOS = [10, 25, 50, 75, 100, 150, 200, 250, 300, 365, 400, 500, 750, 1000];

function comemorarSeFor({ t, data, filmesAntes, filmesDepois, terminou, ano }) {
  if (!dados.preferencias.comemorar) return;
  if (terminou) {
    comemorar('Série terminada', `${nomeDe(t)} foi até o fim. ${plural(temporadasVistas(t).size || 1, 'temporada registrada', 'temporadas registradas')}.`);
    return;
  }
  if (!t || t.tipo !== 'filme' || !data || filmesDepois <= filmesAntes) return;
  const meta = Number(dados.metas[ano]) || 0;
  if (meta && dados.preferencias.mostrarMetas && filmesAntes < meta && filmesDepois >= meta) {
    comemorar('Meta cumprida', `${plural(meta, 'filme', 'filmes')} em ${ano}. ${nomeDe(t)} fechou a conta.`);
  } else if (MARCOS.includes(filmesDepois)) {
    comemorar(`${filmesDepois} filmes`, `${nomeDe(t)} é o ${filmesDepois}º filme de ${ano}.`);
  }
}

function soltarConfete(tela) {
  const ctx = tela.getContext('2d');
  const proporcao = window.devicePixelRatio || 1;
  tela.width = innerWidth * proporcao;
  tela.height = innerHeight * proporcao;
  ctx.setTransform(proporcao, 0, 0, proporcao, 0, 0);
  const estilo = getComputedStyle(document.documentElement);
  const cores = ['--estrela', '--ingresso', '--coracao'].map(v => estilo.getPropertyValue(v).trim()).filter(Boolean).concat(['#4FC3F7', '#FFFFFF']);
  const pecas = Array.from({ length: 140 }, () => ({
    x: Math.random() * innerWidth,
    y: -30 - Math.random() * innerHeight * 0.6,
    largura: 5 + Math.random() * 7,
    altura: 8 + Math.random() * 10,
    cor: cores[Math.floor(Math.random() * cores.length)],
    vy: 2.2 + Math.random() * 3.4,
    vx: -1.2 + Math.random() * 2.4,
    giro: Math.random() * Math.PI,
    vgiro: -0.18 + Math.random() * 0.36,
  }));
  const inicio = performance.now();
  const passo = agora => {
    if (!tela.isConnected) return;
    const passados = agora - inicio;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of pecas) {
      p.x += p.vx;
      p.y += p.vy;
      p.giro += p.vgiro;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.giro);
      ctx.globalAlpha = passados > 3200 ? Math.max(0, 1 - (passados - 3200) / 1200) : 1;
      ctx.fillStyle = p.cor;
      ctx.fillRect(-p.largura / 2, -p.altura / 2, p.largura, p.altura);
      ctx.restore();
    }
    if (passados < 4400) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}

function comemorar(titulo, texto) {
  const anterior = document.querySelector('.festa');
  if (anterior) anterior.remove();
  const festa = document.createElement('div');
  festa.className = 'festa';
  festa.setAttribute('role', 'status');
  festa.innerHTML = `<canvas class="festa-confete" aria-hidden="true"></canvas>
    <div class="festa-cartao">
      <p class="festa-titulo">${esc(titulo)}</p>
      <p class="festa-texto">${esc(texto)}</p>
      <p class="detalhe">Toque para fechar</p>
    </div>`;
  document.body.appendChild(festa);
  let tempo = null;
  const fechar = () => { clearTimeout(tempo); festa.remove(); };
  festa.addEventListener('click', fechar);
  tempo = setTimeout(fechar, 6500);
  const reduzido = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduzido) soltarConfete(festa.querySelector('canvas'));
}


/* ===== Letterboxd: ler CSV e ZIP ===== */

function lerCSV(texto) {
  const linhas = [];
  let campo = '';
  let linha = [];
  let aspas = false;
  const t = String(texto || '').replace(/^\uFEFF/, '');
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (aspas) {
      if (c === '\\' && t[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') {
        if (t[i + 1] === '"') { campo += '"'; i++; }
        else aspas = false;
      } else campo += c;
    } else if (c === '"') {
      aspas = true;
    } else if (c === ',') {
      linha.push(campo); campo = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && t[i + 1] === '\n') i++;
      linha.push(campo); linhas.push(linha); linha = []; campo = '';
    } else {
      campo += c;
    }
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  const cabecalho = (linhas.shift() || []).map(c => c.trim());
  return linhas
    .filter(l => l.some(v => v.trim()))
    .map(l => Object.fromEntries(cabecalho.map((c, i) => [c, (l[i] ?? '').trim()])));
}

async function lerZip(arquivo) {
  const buf = new Uint8Array(await arquivo.arrayBuffer());
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let fim = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { fim = i; break; }
  }
  if (fim < 0) throw new Error('zip inválido');
  const total = dv.getUint16(fim + 10, true);
  let pos = dv.getUint32(fim + 16, true);
  const decodificador = new TextDecoder('utf-8');
  const arquivos = new Map();
  for (let n = 0; n < total && pos + 46 <= buf.length; n++) {
    if (dv.getUint32(pos, true) !== 0x02014b50) break;
    const metodo = dv.getUint16(pos + 10, true);
    const tamanho = dv.getUint32(pos + 20, true);
    const tamNome = dv.getUint16(pos + 28, true);
    const tamExtra = dv.getUint16(pos + 30, true);
    const tamComentario = dv.getUint16(pos + 32, true);
    const local = dv.getUint32(pos + 42, true);
    const nome = decodificador.decode(buf.subarray(pos + 46, pos + 46 + tamNome));
    pos += 46 + tamNome + tamExtra + tamComentario;
    if (!/\.csv$/i.test(nome) || /(^|\/)(__MACOSX|\.)/.test(nome)) continue;
    const inicio = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
    const bruto = buf.subarray(inicio, inicio + tamanho);
    let bytes;
    if (metodo === 0) bytes = bruto;
    else if (metodo === 8) {
      if (typeof DecompressionStream === 'undefined') throw new Error('sem descompressão');
      const fluxo = new Blob([bruto]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      bytes = new Uint8Array(await new Response(fluxo).arrayBuffer());
    } else continue;
    arquivos.set(nome.toLowerCase(), decodificador.decode(bytes));
  }
  return arquivos;
}

/* ===== Letterboxd: montar o plano de importação ===== */

function tipoDeTabela(nome, linhas) {
  const base = nome.split('/').slice(-2).join('/');
  if (/(^|\/)diary\.csv$/.test(base)) return 'diario';
  if (/(^|\/)reviews\.csv$/.test(base)) return 'resenhas';
  if (/(^|\/)watched\.csv$/.test(base)) return 'vistos';
  if (/(^|\/)ratings\.csv$/.test(base)) return 'notas';
  if (/likes\/films\.csv$/.test(base)) return 'curtidos';
  if (/(^|\/)watchlist\.csv$/.test(base)) return 'querover';
  if (/deleted\//.test(nome) || /watchlist|lists?\//.test(nome)) return '';
  const colunas = Object.keys(linhas[0] || {});
  if (!colunas.some(c => /^(name|title)$/i.test(c))) return '';
  if (colunas.some(c => /^watched ?date$/i.test(c))) return 'diario';
  if (colunas.some(c => /^rating$/i.test(c))) return 'notas';
  return 'vistos';
}

function campo(linha, ...nomes) {
  for (const n of nomes) {
    const chave = Object.keys(linha).find(k => k.toLowerCase().replace(/\s+/g, '') === n.toLowerCase().replace(/\s+/g, ''));
    if (chave && linha[chave]) return linha[chave];
  }
  return '';
}

function montarPlanoImportacao(tabelas) {
  const filmes = new Map();
  const pegar = (linha, visto = true) => {
    const nome = campo(linha, 'Name', 'Title');
    if (!nome) return null;
    const ano = inteiroOuNulo(campo(linha, 'Year'), 1870, 2200);
    const chave = `${chaveTexto(nome)}|${ano || ''}`;
    if (!filmes.has(chave)) filmes.set(chave, { nome, ano, tmdb: inteiroOuNulo(campo(linha, 'tmdbID'), 1), registros: [], curtiu: false, notaSolta: null, visto: false, querVer: false, querVerEm: null });
    const f = filmes.get(chave);
    if (visto) f.visto = true;
    return f;
  };
  const porTipo = { diario: [], resenhas: [], vistos: [], notas: [], curtidos: [], querover: [] };
  for (const [nome, linhas] of tabelas) {
    const tipo = tipoDeTabela(nome, linhas);
    if (tipo) porTipo[tipo].push(...linhas);
  }
  const dataDe = linha => {
    const d = campo(linha, 'Watched Date', 'WatchedDate');
    return dataValida(d) ? d : null;
  };
  const tagsDe = linha => campo(linha, 'Tags').split(',').map(x => x.trim()).filter(Boolean);
  for (const l of porTipo.diario) {
    const f = pegar(l);
    if (!f) continue;
    f.registros.push({
      data: dataDe(l) || (dataValida(campo(l, 'Date')) ? campo(l, 'Date') : null),
      nota: notaValida(campo(l, 'Rating')) || (inteiroOuNulo(campo(l, 'Rating10'), 1, 10) ? inteiroOuNulo(campo(l, 'Rating10'), 1, 10) / 2 : null),
      revisto: /^(yes|true|sim|1)$/i.test(campo(l, 'Rewatch')),
      tags: tagsDe(l),
      comentario: campo(l, 'Review'),
    });
  }
  for (const l of porTipo.resenhas) {
    const f = pegar(l);
    if (!f) continue;
    const data = dataDe(l);
    const texto = campo(l, 'Review');
    const alvo = f.registros.find(r => r.data === data) || (data ? null : f.registros.find(r => !r.comentario));
    if (alvo) { if (texto) alvo.comentario = texto; }
    else f.registros.push({ data, nota: notaValida(campo(l, 'Rating')), revisto: /^(yes|true)$/i.test(campo(l, 'Rewatch')), tags: tagsDe(l), comentario: texto });
  }
  for (const l of porTipo.vistos) pegar(l);
  for (const l of porTipo.notas) {
    const f = pegar(l);
    if (f) f.notaSolta = notaValida(campo(l, 'Rating'));
  }
  for (const l of porTipo.curtidos) {
    const f = pegar(l);
    if (f) f.curtiu = true;
  }
  for (const l of porTipo.querover) {
    const f = pegar(l, false);
    if (!f) continue;
    f.querVer = true;
    if (dataValida(campo(l, 'Date'))) f.querVerEm = campo(l, 'Date');
  }
  for (const f of filmes.values()) {
    if (!f.registros.length && f.visto) f.registros.push({ data: null, nota: f.notaSolta, revisto: false, tags: [], comentario: '' });
    else if (f.notaSolta && !f.registros.some(r => r.nota)) {
      const ordenados = [...f.registros].sort((a, b) => String(b.data || '').localeCompare(String(a.data || '')));
      ordenados[0].nota = f.notaSolta;
    }
  }
  const lista = [...filmes.values()];
  return {
    filmes: lista,
    registros: lista.reduce((s, f) => s + f.registros.length, 0),
    semData: lista.reduce((s, f) => s + f.registros.filter(r => !r.data).length, 0),
    curtidos: lista.filter(f => f.curtiu).length,
    vistos: lista.filter(f => f.visto).length,
    querVer: lista.filter(f => f.querVer).length,
  };
}

async function lerArquivoImportacao(arquivo) {
  const erro = document.querySelector('[data-erro-importacao]');
  if (erro) erro.textContent = 'Lendo o arquivo…';
  let tabelas = new Map();
  try {
    if (/\.zip$/i.test(arquivo.name) || /zip/.test(arquivo.type)) {
      for (const [nome, texto] of await lerZip(arquivo)) tabelas.set(nome, lerCSV(texto));
    } else {
      tabelas.set(arquivo.name.toLowerCase(), lerCSV(await arquivo.text()));
    }
  } catch (e) {
    if (erro) erro.textContent = e.message === 'sem descompressão'
      ? 'Este navegador não consegue abrir o .zip. Extraia o diary.csv do arquivo e escolha o .csv.'
      : 'Não foi possível ler esse arquivo. Escolha o .zip exportado pelo Letterboxd ou um dos .csv de dentro dele.';
    return;
  }
  const plano = montarPlanoImportacao(tabelas);
  if (!plano.filmes.length) {

  });

function melhorCandidato(resultados, f) {
  const alvo = chaveTexto(f.nome);
  let melhor = null;
  let pontos = -Infinity;
  resultados.slice(0, 10).forEach((r, i) => {
    const ano = anoDaData(r.release_date);
    let p = -i * 0.1;
    if (chaveTexto(r.title) === alvo || chaveTexto(r.original_title) === alvo) p += 4;
    if (f.ano && ano === f.ano) p += 3;
    else if (f.ano && ano && Math.abs(ano - f.ano) === 1) p += 1;
    if (p > pontos) { pontos = p; melhor = r; }
  });
  if (!melhor) return null;
  return pontos >= 0.5 || !f.ano ? melhor : null;
}

async function acharNoTMDB(f) {
  if (f.tmdb) return detalhesDoTMDB('filme', f.tmdb);
  let resultado = await tmdb('search/movie', { query: f.nome, primary_release_year: f.ano || '', include_adult: 'false' });
  let escolhido = melhorCandidato((resultado && resultado.results) || [], f);
  if (!escolhido && f.ano) {
    resultado = await tmdb('search/movie', { query: f.nome, include_adult: 'false' });
    escolhido = melhorCandidato((resultado && resultado.results) || [], f);
  }
  return escolhido ? detalhesDoTMDB('filme', escolhido.id) : null;
}

function ondeDasTags(tags) {
  let onde = '';
  const resto = [];
  for (const tag of tags) {
    const k = chaveTexto(tag);
    const p = !onde && dados.plataformas.find(x => chaveTexto(x.nome) === k || (x.busca || []).some(b => chaveTexto(b) === k) || chaveTexto(x.nome).replace(/\s/g, '') === k.replace(/\s/g, ''));
    if (p) onde = p.id;
    else resto.push(tag);
  }
  return { onde, tags: resto };
}

async function executarImportacao() {
  const f = estado.formulario;
  if (!f || !f.plano) return;
  const pular = !!(document.querySelector('#modal [name="pular"]') || {}).checked;
  const plano = f.plano;
  estado.lote = { cancelado: false };
  abrirModal({
    titulo: 'Importando',
    corpo: `<p data-lote-texto>Procurando os filmes no TMDB…</p><div class="progresso-lote"><span data-lote-barra style="width:0%"></span></div><p class="detalhe" data-lote-detalhe></p>`,
    rodape: '<button type="button" class="botao" data-acao="cancelar-lote">Parar</button>',
  });
  const fila = plano.filmes.map((filme, i) => ({ filme, i }));
  const achados = new Array(plano.filmes.length).fill(null);
  let feitos = 0;
  let erroFatal = null;
  const trabalhar = async () => {
    while (fila.length && !estado.lote.cancelado && !erroFatal) {
      const { filme, i } = fila.shift();
      try {
        achados[i] = await acharNoTMDB(filme);
      } catch (e) {
        if (e.tipo === 'chave' || e.tipo === 'sem-chave') erroFatal = e;
      }
      feitos++;
      const texto = document.querySelector('[data-lote-texto]');
      const barra = document.querySelector('[data-lote-barra]');
      const detalhe = document.querySelector('[data-lote-detalhe]');
      if (texto) texto.textContent = `${feitos} de ${plano.filmes.length} filmes procurados`;
      if (barra) barra.style.width = `${feitos / plano.filmes.length * 100}%`;
      if (detalhe) detalhe.textContent = filme.nome;
    }
  };
  await Promise.all([trabalhar(), trabalhar(), trabalhar(), trabalhar()]);
  const cancelado = estado.lote.cancelado;
  estado.lote = null;
  if (erroFatal) {
    abrirModal({ titulo: 'Importação interrompida', corpo: `<p>${esc(explicarErroTMDB(erroFatal))}</p>`, rodape: '<button type="button" class="botao primario" data-acao="fechar-modal">Fechar</button>' });
    return;
  }
  const semTmdb = [];
  let novosRegistros = 0;
  let pulados = 0;
  let novosTitulos = 0;
  let paraQueroVer = 0;
  alterar(() => {
    plano.filmes.forEach((filme, i) => {
      if (cancelado && i >= feitos) return;
      const meta = achados[i];
      let t = meta ? tituloDoTmdb('filme', meta.tmdb) : dados.titulos.find(x => !x.tmdb && x.tipo === 'filme' && chaveTexto(x.titulo) === chaveTexto(filme.nome) && x.ano === filme.ano);
      if (!t) {
        t = normalizarTitulo(meta ? { ...meta, id: novoId('t'), criadoEm: new Date().toISOString() } : { tipo: 'filme', titulo: filme.nome, ano: filme.ano, id: novoId('t'), criadoEm: new Date().toISOString() });
        if (meta) aplicarMeta(t, meta);
        dados.titulos.push(t);
        indice.titulos.set(t.id, t);
        if (t.tmdb) indice.porTmdb.set(`filme:${t.tmdb}`, t);
        novosTitulos++;
        if (!meta) semTmdb.push(filme);
      }
      if (filme.curtiu) t.favorito = true;
      if (filme.querVer && !t.querVer) {
        t.querVer = true;
        t.querVerEm = filme.querVerEm || hojeISO();
        paraQueroVer++;
      }
      const existentes = dados.registros.filter(r => r.titulo === t.id);
      for (const reg of filme.registros) {
        if (pular && existentes.some(r => r.data === reg.data)) { pulados++; continue; }
        const { onde, tags } = ondeDasTags(reg.tags || []);
        const novo = normalizarRegistro({ ...reg, onde, tags, titulo: t.id, id: novoId('r'), criadoEm: new Date().toISOString() });
        dados.registros.push(novo);
        existentes.push(novo);
        novosRegistros++;
      }
    });
  });
  abrirModal({
    titulo: cancelado ? 'Importação parada' : 'Importação concluída',
    corpo: `<p class="resumo" style="margin:4px 0 12px">${plural(novosRegistros, 'registro entrou', 'registros entraram')} no diário${novosTitulos ? `, com ${plural(novosTitulos, 'título novo', 'títulos novos')}` : ''}.</p>
      <ul class="lista-simples">
        ${paraQueroVer ? `<li>${plural(paraQueroVer, 'filme foi', 'filmes foram')} para o Quero ver.</li>` : ''}
        ${pulados ? `<li>${plural(pulados, 'registro já estava', 'registros já estavam')} no diário e ${pulados === 1 ? 'foi pulado' : 'foram pulados'}.</li>` : ''}
        ${cancelado ? `<li>Os ${plural(plano.filmes.length - feitos, 'filme restante ficou', 'filmes restantes ficaram')} de fora. Importe o mesmo arquivo de novo para completar: o que já entrou é pulado.</li>` : ''}
        ${semTmdb.length ? `<li>${plural(semTmdb.length, 'filme não foi achado', 'filmes não foram achados')} no TMDB e ${semTmdb.length === 1 ? 'entrou' : 'entraram'} sem pôster: ${esc(juntarNomes(semTmdb.slice(0, 8).map(x => `${x.nome}${x.ano ? ` (${x.ano})` : ''}`)))}${semTmdb.length > 8 ? ' e outros' : ''}. Em Configurações, Busca de filmes e séries, dá para ligar cada um.</li>` : ''}
      </ul>`,
    rodape: '<button type="button" class="botao" data-acao="fechar-modal">Fechar</button><button type="button" class="botao primario" data-acao="ir-diario">Ver o diário</button>',
  });
}

function campoCSV(v) {
  const s = String(v ?? '');
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '\\"')}"` : s;
}

function gerarCSVLetterboxd() {
  const cabecalho = ['tmdbID', 'Title', 'Year', 'Directors', 'WatchedDate', 'Rating', 'Rewatch', 'Tags', 'Review'];
  const linhas = registrosComTitulo()
    .filter(x => x.t.tipo === 'filme')
    .sort((a, b) => String(a.r.data || '').localeCompare(String(b.r.data || '')))
    .map(({ r, t }) => {
      const p = plataformaPorId(r.onde);
      return [
        t.tmdb || '', t.original || t.titulo, t.ano || '', t.direcao.join(', '), r.data || '',
        r.nota || '', r.revisto ? 'true' : '', [p ? p.nome.toLowerCase() : '', ...r.tags].filter(Boolean).join(', '), r.comentario,
      ];
    });
  return [cabecalho, ...linhas].map(l => l.map(campoCSV).join(',')).join('\n');
}

function exportarLetterboxd() {
  const filmes = dados.registros.filter(r => (tituloPorId(r.titulo) || {}).tipo === 'filme').length;
  if (!filmes) { avisar('Não há filmes no diário para exportar.'); return; }
  baixarConteudo('\uFEFF' + gerarCSVLetterboxd(), `Cinemateca para Letterboxd ${hojeISO()}.csv`, 'text/csv;charset=utf-8');
  avisar(`${plural(filmes, 'registro de filme exportado', 'registros de filmes exportados')}. No Letterboxd, use Settings, Import.`, { tempo: 9000 });
}

/* ===== Excel (.xlsx) sem bibliotecas externas ===== */

const TABELA_CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = TABELA_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function zipar(arquivos) {
  const cod = new TextEncoder();
  const locais = [];
  const centrais = [];
  let deslocamento = 0;
  for (const arq of arquivos) {
    const nome = cod.encode(arq.nome);
    const conteudo = cod.encode(arq.conteudo);
    const crc = crc32(conteudo);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);
    local.setUint16(12, 0x21, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, conteudo.length, true);
    local.setUint32(22, conteudo.length, true);
    local.setUint16(26, nome.length, true);
    locais.push(new Uint8Array(local.buffer), nome, conteudo);
    const central = new DataView(new ArrayBuffer(46));
    central.setUint32(0, 0x02014b50, true);
    central.setUint16(4, 20, true);
    central.setUint16(6, 20, true);
    central.setUint16(8, 0x0800, true);
    central.setUint16(14, 0x21, true);
    central.setUint32(16, crc, true);
    central.setUint32(20, conteudo.length, true);
    central.setUint32(24, conteudo.length, true);
    central.setUint16(28, nome.length, true);
    central.setUint32(42, deslocamento, true);
    centrais.push(new Uint8Array(central.buffer), nome);
    deslocamento += 30 + nome.length + conteudo.length;
  }
  const tamanhoCentral = centrais.reduce((s, p) => s + p.length, 0);
  const fim = new DataView(new ArrayBuffer(22));
  fim.setUint32(0, 0x06054b50, true);
  fim.setUint16(8, arquivos.length, true);
  fim.setUint16(10, arquivos.length, true);
  fim.setUint32(12, tamanhoCentral, true);
  fim.setUint32(16, deslocamento, true);
  const partes = [...locais, ...centrais, new Uint8Array(fim.buffer)];
  const saida = new Uint8Array(partes.reduce((s, p) => s + p.length, 0));
  let pos = 0;
  for (const p of partes) { saida.set(p, pos); pos += p.length; }
  return saida;
}

function xmlEsc(valor) {
  return String(valor)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function letraColuna(indice) {
  let s = '';
  let n = indice + 1;
  while (n > 0) {
    const r = (n - 1) % 26;
    s = String.fromCharCode(65 + r) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function serialExcel(iso) {
  const [a, m, d] = iso.split('-').map(Number);
  return Math.round((Date.UTC(a, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000);
}

function planilhaXML(colunas, linhas) {
  const cabecalho = colunas.map((c, i) => `<c r="${letraColuna(i)}1" t="inlineStr" s="1"><is><t>${xmlEsc(c.titulo)}</t></is></c>`).join('');
  const corpo = linhas.map((linha, li) => {
    const r = li + 2;
    const celulas = colunas.map((c, ci) => {
      const v = linha[ci];
      const ref = letraColuna(ci) + r;
      if (v === null || v === undefined || v === '') return '';
      if (c.tipo === 'numero' && typeof v === 'number' && isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
      if (c.tipo === 'data' && dataValida(v)) return `<c r="${ref}" s="2"><v>${serialExcel(v)}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    }).join('');
    return `<row r="${r}">${celulas}</row>`;
  }).join('');
  const ultima = `${letraColuna(colunas.length - 1)}${linhas.length + 1}`;
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    + `<dimension ref="A1:${ultima}"/>`
    + '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
    + '<sheetFormatPr defaultRowHeight="15"/>'
    + `<cols>${colunas.map((c, i) => `<col min="${i + 1}" max="${i + 1}" width="${c.largura || 14}" customWidth="1"/>`).join('')}</cols>`
    + `<sheetData><row r="1">${cabecalho}</row>${corpo}</sheetData>`
    + `<autoFilter ref="A1:${ultima}"/>`
    + '</worksheet>';
}

function montarXLSX(abas) {
  const arquivos = [];
  const tipos = abas.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('');
  arquivos.push({ nome: '[Content_Types].xml', conteudo: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' + tipos + '</Types>' });
  arquivos.push({ nome: '_rels/.rels', conteudo: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' });
  const folhas = abas.map((a, i) => `<sheet name="${xmlEsc(a.nome)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('');
  const filtros = abas.map((a, i) => `<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${xmlEsc(a.nome)}'!$A$1:$${letraColuna(a.colunas.length - 1)}$${a.linhas.length + 1}</definedName>`).join('');
  arquivos.push({ nome: 'xl/workbook.xml', conteudo: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${folhas}</sheets><definedNames>${filtros}</definedNames></workbook>` });
  const rels = abas.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('');
  arquivos.push({ nome: 'xl/_rels/workbook.xml.rels', conteudo: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels}<Relationship Id="rId${abas.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` });
  arquivos.push({ nome: 'xl/styles.xml', conteudo: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' });
  abas.forEach((a, i) => arquivos.push({ nome: `xl/worksheets/sheet${i + 1}.xml`, conteudo: planilhaXML(a.colunas, a.linhas) }));
  return zipar(arquivos);
}

/* ===== Serializd =====
   O Serializd não tem exportação. O diário de cada perfil é público e sai da
   API interna do próprio site (não documentada, pode mudar sem aviso).
   coletarSerializd não usa nada do app: ela roda aqui dentro e também vira o
   comando que a pessoa cola no Console do serializd.com quando o Serializd
   não deixa um site de fora ler os dados. */

async function coletarSerializd(usuario, informar) {
  const api = 'https://serializd.onrender.com/api/';
  const pegar = async caminho => {
    const resposta = await fetch(api + caminho, { headers: { 'X-Requested-With': 'serializd_vercel' } });
    const corpo = await resposta.json().catch(() => ({}));
    if (!resposta.ok) throw Object.assign(new Error('O Serializd respondeu com erro ' + resposta.status + '.'), { status: resposta.status });
    return corpo;
  };
  const nome = String(usuario || '').trim().replace(/^@/, '');
  const u = encodeURIComponent(nome);
  const diario = [];
  for (let pagina = 1, total = 1; pagina <= total && pagina <= 400; pagina++) {
    const d = await pegar('user/' + u + '/diary?page=' + pagina);
    if (d && d.message && !Array.isArray(d.reviews)) {
      throw Object.assign(new Error(d.message), { usuarioInvalido: /invalid user/i.test(d.message) });
    }
    total = Math.max(1, Number(d.totalPages) || 1);
    diario.push(...(Array.isArray(d.reviews) ? d.reviews : []));
    informar('Diário: página ' + pagina + ' de ' + total);
  }
  const lista = async (caminho, rotulo) => {
    const itens = [];
    try {
      for (let pagina = 1, total = 1; pagina <= total && pagina <= 200; pagina++) {
        const d = await pegar('user/' + u + '/' + caminho + '/' + pagina + '?sort_by=');
        total = Math.max(1, Number(d.totalPages) || 1);
        itens.push(...(Array.isArray(d.items) ? d.items : []));
        informar(rotulo + ': página ' + pagina + ' de ' + total);
      }
    } catch (e) {
      if (e instanceof TypeError) throw e;
    }
    return itens;
  };
  const assistindo = await lista('currently_watching_page', 'Assistindo');
  const pausadas = await lista('paused_shows_page', 'Pausadas');
  const abandonadas = await lista('dropped_shows_page', 'Abandonadas');
  const vistas = await lista('watchedpage_v2', 'Vistas');
  const querVer = await lista('watchlistpage_v2', 'Quero ver');
  const precisa = new Set();
  for (const v of vistas) {
    if (Array.isArray(v.seasonIds) && v.seasonIds.length) precisa.add(v.showId);
  }
  for (const r of diario) {
    const conhecidas = Array.isArray(r.showSeasons) ? r.showSeasons : [];
    if (r.seasonId && !conhecidas.some(s => s.id === r.seasonId)) precisa.add(r.showId);
  }
  const temporadas = {};
  let feitas = 0;
  for (const id of precisa) {
    try {
      const s = await pegar('show/' + id);
      const mapa = {};
      for (const t of (s && s.seasons) || []) {
        const numero = t.seasonNumber;
        const sid = t.id != null ? t.id : t.seasonId;
        if (numero != null && sid != null) mapa[sid] = numero;
      }
      temporadas[id] = mapa;
    } catch (e) {
      if (e instanceof TypeError) throw e;
    }
    feitas++;
    informar('Temporadas: ' + feitas + ' de ' + precisa.size + ' séries');
  }
  return { formato: 'serializd-para-cinemateca', versao: 1, usuario: nome, geradoEm: new Date().toISOString(), diario, assistindo, pausadas, abandonadas, vistas, querVer, temporadas };
}

function comandoSerializd(usuario) {
  return `(${coletarSerializd.toString()})(${JSON.stringify(usuario)}, console.log).then(dados => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(dados)], { type: 'application/json' }));
  a.download = 'serializd-' + dados.usuario + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  console.log('Pronto: ' + dados.diario.length + ' registros salvos em ' + a.download + '. Volte para a Minha cinemateca e escolha esse arquivo.');
}).catch(e => console.error('Não deu certo: ' + e.message));`;
}

async function lerSerializdDireto() {
  const campo = document.querySelector('[data-usuario-serializd]');
  const usuario = ((campo && campo.value) || '').trim().replace(/^@/, '');
  if (!usuario) {
    statusSerializd('Escreva o seu nome de usuário no Serializd.');
    if (campo) campo.focus();
    return;
  }
  const botao = document.querySelector('#modal [data-acao="ler-serializd"]');
  if (botao) botao.disabled = true;
  statusSerializd('Lendo o diário. Se o Serializd estiver acordando, a primeira resposta pode levar meio minuto.');
  try {
    const dados = await coletarSerializd(usuario, statusSerializd);
    mostrarPlanoSerializd(dados);
  } catch (e) {
    if (botao) botao.disabled = false;
    if (e instanceof TypeError) {
      abrirComandoSerializd(usuario);
    } else if (e.usuarioInvalido) {
      statusSerializd('Esse usuário não existe no Serializd. Confira o nome como aparece no seu perfil.');
    } else {
      statusSerializd(`${e.message} Tente de novo em instantes.`);
    }
  }

async function lerArquivoSerializd(arquivo) {
  let dados = null;
  try {
    dados = JSON.parse((await arquivo.text()).replace(/^\uFEFF/, ''));
  } catch (e) {
    dados = null;
  }
  const valido = dados && (Array.isArray(dados) || Array.isArray(dados.diario) || Array.isArray(dados.reviews));
  if (!valido) {
    const texto = 'Esse arquivo não é o que o comando do Serializd gera. Escolha o serializd-….json baixado.';
    if (!statusSerializd(texto)) avisar(texto);
    return;
  }
  mostrarPlanoSerializd(dados);
}

/* ----- Plano ----- */

function dataSerializd(valor) {
  if (!valor) return null;
  const texto = String(valor);
  if (/^\d{4}-\d{2}-\d{2}$/.test(texto)) return texto;
  if (/^\d{4}-\d{2}-\d{2}T00:00(:00(\.0+)?)?(Z|\+00:00)?$/.test(texto)) return texto.slice(0, 10);
  const d = new Date(texto);
  return isNaN(d) ? null : isoLocal(d);
}

function planoSerializd(arquivo) {
  const diario = Array.isArray(arquivo) ? arquivo : (arquivo.diario || arquivo.reviews || []);
  const mapas = (!Array.isArray(arquivo) && arquivo.temporadas) || {};
  const series = new Map();
  const pegar = (id, nome) => {
    if (!series.has(id)) series.set(id, { tmdb: id, nome: '', registros: [], semData: new Set(), serieVista: false, situacao: '', curtiu: false, querVer: false, querVerEm: null });
    const s = series.get(id);
    if (!s.nome && nome) s.nome = String(nome);
    return s;
  };
  const numeroDaTemporada = (showId, seasonId, entrada) => {
    const lista = entrada && Array.isArray(entrada.showSeasons) ? entrada.showSeasons : [];
    const achada = lista.find(s => s.id === seasonId);
    if (achada && Number.isInteger(achada.seasonNumber)) return achada.seasonNumber;
    const mapa = mapas[showId];
    if (mapa && mapa[seasonId] !== undefined && mapa[seasonId] !== null) return Number(mapa[seasonId]);
    const texto = /(\d+)/.exec((entrada && entrada.seasonName) || '');
    return texto ? Number(texto[1]) : undefined;
  };
  let episodios = 0;
  let especiais = 0;
  let ignorados = 0;
  for (const e of diario) {
    const showId = inteiroOuNulo(e && e.showId, 1);
    if (!showId) { ignorados++; continue; }
    if (Number(e.episodeNumber) > 0) { episodios++; continue; }
    let temporada = null;
    if (e.seasonId) {
      const n = numeroDaTemporada(showId, e.seasonId, e);
      if (n === 0) { especiais++; continue; }
      if (n === undefined) { ignorados++; continue; }
      temporada = n;
    }
    const s = pegar(showId, e.showName);
    s.registros.push({
      data: dataSerializd(e.backdate || e.dateAdded),
      nota: Number(e.rating) > 0 ? notaValida(Number(e.rating) / 2) : null,
      temporada,
      revisto: !!e.isRewatched,
      comentario: String(e.reviewText || '').trim(),
      tags: [],
    });
    if (e.like === true) s.curtiu = true;
  }
  if (!Array.isArray(arquivo)) {
    for (const [lista, situacao] of [[arquivo.abandonadas, 'abandonada'], [arquivo.pausadas, 'pausada'], [arquivo.assistindo, 'assistindo']]) {
      for (const item of lista || []) {
        const id = inteiroOuNulo(item && item.showId, 1);
        if (!id) continue;
        const s = pegar(id, item.showName);
        if (!s.situacao) s.situacao = situacao;
      }
    }
    for (const item of arquivo.querVer || []) {
      const id = inteiroOuNulo(item && item.showId, 1);
      if (!id) continue;
      const s = pegar(id, item.showName);
      s.querVer = true;
      s.querVerEm = dataSerializd(item.dateAdded);
    }
    for (const item of arquivo.vistas || []) {
      const id = inteiroOuNulo(item && item.showId, 1);
      if (!id) continue;
      const s = pegar(id, item.showName);
      const ids = Array.isArray(item.seasonIds) ? item.seasonIds : [];
      if (!ids.length) { s.serieVista = true; continue; }
      for (const sid of ids) {
        const n = numeroDaTemporada(id, sid, null);
        if (n > 0) s.semData.add(n);
      }
    }
  }
  let registros = 0;
  let semData = 0;
  for (const s of series.values()) {
    const comRegistro = new Set(s.registros.map(r => r.temporada).filter(n => n !== null));
    for (const n of [...s.semData]) if (comRegistro.has(n)) s.semData.delete(n);
    if (s.serieVista && (s.registros.length || s.semData.size)) s.serieVista = false;
    const soltos = s.semData.size + (s.serieVista ? 1 : 0);
    registros += s.registros.length + soltos;
    semData += soltos + s.registros.filter(r => !r.data).length;
  }
  const lista = [...series.values()];
  return { series: lista, registros, semData, episodios, especiais, ignorados, comSituacao: lista.filter(s => s.situacao).length, querVer: lista.filter(s => s.querVer).length };
}

function mostrarPlanoSerializd(arquivo) {
  const plano = planoSerializd(arquivo);
  if (!plano.series.length) {
    const texto = 'Nenhuma série encontrada nesse diário.';
    if (!statusSerializd(texto)) avisar(texto);
    return;
  }
  estado.formulario = { tipo: 'serializd', plano };
  abrirModal({
    titulo: 'Importar do Serializd',
    corpo: `<p class="resumo" style="margin:4px 0 12px">${plural(plano.series.length, 'série', 'séries')} e ${plural(plano.registros, 'registro', 'registros')} encontrados.</p>
      <ul class="lista-simples">
        ${plano.semData ? `<li>${plural(plano.semData, 'registro não tem data e vai', 'registros não têm data e vão')} para o fim do diário, em Sem data.</li>` : ''}
        ${plano.querVer ? `<li>${plural(plano.querVer, 'série da watchlist vai', 'séries da watchlist vão')} para o Quero ver.</li>` : ''}
        ${plano.comSituacao ? `<li>${plural(plano.comSituacao, 'série leva', 'séries levam')} a situação que está no Serializd: assistindo, pausada ou abandonada.</li>` : ''}
        ${plano.episodios ? `<li>${plural(plano.episodios, 'registro de episódio fica', 'registros de episódios ficam')} de fora, porque a cinemateca registra temporadas inteiras.</li>` : ''}
        ${plano.especiais ? `<li>${plural(plano.especiais, 'registro de episódios especiais fica', 'registros de episódios especiais ficam')} de fora.</li>` : ''}
        ${plano.ignorados ? `<li>${plural(plano.ignorados, 'registro sem série reconhecível fica', 'registros sem série reconhecível ficam')} de fora.</li>` : ''}
        <li>O Serializd não guarda onde você assistiu. Dá para completar depois, editando cada registro.</li>
      </ul>
      <label class="opcao-check"><input type="checkbox" name="pular" checked> Pular registros que já estão no diário, com a mesma série, temporada e data</label>`,
    rodape: '<button type="button" class="botao" data-acao="fechar-modal">Cancelar</button><button type="button" class="botao primario" data-acao="executar-importacao-serializd">Importar</button>',
  });
}

/* ----- Importação ----- */

async function executarImportacaoSerializd() {
  const f = estado.formulario;
  if (!f || !f.plano) return;
  const pular = !!(document.querySelector('#modal [name="pular"]') || {}).checked;
  const plano = f.plano;
  estado.lote = { cancelado: false };
  abrirModal({
    titulo: 'Importando',
    corpo: '<p data-lote-texto>Procurando as séries no TMDB…</p><div class="progresso-lote"><span data-lote-barra style="width:0%"></span></div><p class="detalhe" data-lote-detalhe></p>',
    rodape: '<button type="button" class="botao" data-acao="cancelar-lote">Parar</button>',
  });
  const fila = plano.series.map((serie, i) => ({ serie, i }));
  const metas = new Array(plano.series.length).fill(null);
  const feitas = new Set();
  let erroFatal = null;
  const trabalhar = async () => {
    while (fila.length && !estado.lote.cancelado && !erroFatal) {
      const { serie, i } = fila.shift();
      try {
        metas[i] = await detalhesDoTMDB('serie', serie.tmdb);
      } catch (e) {
        if (e.tipo === 'chave' || e.tipo === 'sem-chave') erroFatal = e;
      }
      feitas.add(i);
      const texto = document.querySelector('[data-lote-texto]');
      const barra = document.querySelector('[data-lote-barra]');
      const detalhe = document.querySelector('[data-lote-detalhe]');
      if (texto) texto.textContent = `${feitas.size} de ${plano.series.length} séries procuradas`;
      if (barra) barra.style.width = `${feitas.size / plano.series.length * 100}%`;
      if (detalhe) detalhe.textContent = serie.nome;
    }
  };
  await Promise.all([trabalhar(), trabalhar(), trabalhar(), trabalhar()]);
  const cancelado = estado.lote.cancelado;
  estado.lote = null;
  if (erroFatal) {
    abrirModal({ titulo: 'Importação interrompida', corpo: `<p>${esc(explicarErroTMDB(erroFatal))}</p>`, rodape: '<button type="button" class="botao primario" data-acao="fechar-modal">Fechar</button>' });
    return;
  }
  const agora = new Date().toISOString();
  const semTmdb = [];
  let novosRegistros = 0;
  let pulados = 0;
  let novosTitulos = 0;
  let paraQueroVer = 0;
  alterar(() => {
    plano.series.forEach((serie, i) => {
      if (!feitas.has(i)) return;
      const meta = metas[i];
      const nome = serie.nome || (meta && meta.titulo) || `Série ${serie.tmdb}`;
      let t = tituloDoTmdb('serie', serie.tmdb)
        || dados.titulos.find(x => x.tipo === 'serie' && !x.tmdb && chaveTexto(x.titulo) === chaveTexto(nome));
      if (!t) {
        t = normalizarTitulo(meta ? { ...meta, id: novoId('t'), criadoEm: agora } : { tipo: 'serie', titulo: nome, id: novoId('t'), criadoEm: agora });
        if (meta) aplicarMeta(t, meta);
        dados.titulos.push(t);
        indice.titulos.set(t.id, t);
        if (t.tmdb) indice.porTmdb.set(`serie:${t.tmdb}`, t);
        novosTitulos++;
        if (!meta) semTmdb.push(nome);
      }
      if (serie.curtiu) t.favorito = true;
      if (serie.querVer && !t.querVer) {
        t.querVer = true;
        t.querVerEm = serie.querVerEm || hojeISO();
        paraQueroVer++;
      }
      const existentes = dados.registros.filter(r => r.titulo === t.id);
      const soltos = [...serie.semData].sort((a, b) => a - b).map(n => ({ data: null, nota: null, temporada: n, revisto: false, comentario: '', tags: [] }));
      if (serie.serieVista) soltos.push({ data: null, nota: null, temporada: null, revisto: false, comentario: '', tags: [] });
      for (const reg of [...serie.registros, ...soltos]) {
        if (pular && existentes.some(r => r.data === reg.data && r.temporada === reg.temporada)) { pulados++; continue; }
        const novo = normalizarRegistro({ ...reg, onde: '', titulo: t.id, id: novoId('r'), criadoEm: agora });
        dados.registros.push(novo);
        existentes.push(novo);
        novosRegistros++;
      }
      if (serie.situacao) {
        t.situacao = serie.situacao;
      } else if (!t.situacao && existentes.length) {
        const vistas = existentes.map(r => r.temporada).filter(n => n > 0);
        const alcance = vistas.length ? Math.max(...vistas) : null;
        const sugerida = situacaoDepoisDe(t, alcance);
        if (sugerida !== 'assistindo') t.situacao = sugerida;
      }
    });
  });
  const restantes = plano.series.length - feitas.size;
  abrirModal({
    titulo: cancelado ? 'Importação parada' : 'Importação concluída',
    corpo: `<p class="resumo" style="margin:4px 0 12px">${plural(novosRegistros, 'registro entrou', 'registros entraram')} no diário${novosTitulos ? `, com ${plural(novosTitulos, 'série nova', 'séries novas')}` : ''}.</p>
      <ul class="lista-simples">
        ${paraQueroVer ? `<li>${plural(paraQueroVer, 'série foi', 'séries foram')} para o Quero ver.</li>` : ''}
        ${pulados ? `<li>${plural(pulados, 'registro já estava', 'registros já estavam')} no diário e ${pulados === 1 ? 'foi pulado' : 'foram pulados'}.</li>` : ''}
        ${cancelado && restantes ? `<li>${plural(restantes, 'série ficou', 'séries ficaram')} de fora. Importe de novo para completar: o que já entrou é pulado.</li>` : ''}
        ${semTmdb.length ? `<li>${plural(semTmdb.length, 'série não foi achada', 'séries não foram achadas')} no TMDB e ${semTmdb.length === 1 ? 'entrou' : 'entraram'} sem pôster: ${esc(juntarNomes(semTmdb.slice(0, 8)))}${semTmdb.length > 8 ? ' e outras' : ''}.</li>` : ''}
      </ul>`,
    rodape: '<button type="button" class="botao" data-acao="fechar-modal">Fechar</button><button type="button" class="botao primario" data-acao="ir-diario">Ver o diário</button>',
  });
}


/* ===== Ligação com o OneDrive ===== */

const ONEDRIVE_ESCOPOS = 'Files.ReadWrite offline_access User.Read';
const ONEDRIVE_CHAVE = `${PREFIXO}:onedrive`;
const NOME_ARQUIVO_NUVEM = 'Cinemateca.json';

function lerSessaoOneDrive() {
  try { return JSON.parse(localStorage.getItem(ONEDRIVE_CHAVE) || '{}'); } catch (e) { return {}; }
}

function guardarSessaoOneDrive(novo) {
  const atual = lerSessaoOneDrive();
  try { localStorage.setItem(ONEDRIVE_CHAVE, JSON.stringify({ ...atual, ...novo })); } catch (e) { /* ignora */ }
}

function limparSessaoOneDrive() {
  const { clientId } = lerSessaoOneDrive();
  try { localStorage.removeItem(ONEDRIVE_CHAVE); } catch (e) { /* ignora */ }
  if (clientId) guardarSessaoOneDrive({ clientId });
}

function idDoAplicativo() {
  return (lerSessaoOneDrive().clientId || ONEDRIVE_CLIENT_ID || '').trim();
}

function autoridadeOneDrive() {
  return lerSessaoOneDrive().autoridade || 'consumers';
}

function enderecoDeRetorno() {
  return location.origin + location.pathname.replace(/index\.html?$/i, '');
}

function oneDriveLigado() {
  const s = lerSessaoOneDrive();
  return !!(s.token || s.refresh);
}

function base64url(bytes) {
  let texto = '';
  bytes.forEach(b => { texto += String.fromCharCode(b); });
  return btoa(texto).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function gerarPkce() {
  const verificador = base64url(crypto.getRandomValues(new Uint8Array(32)));
  const resumo = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verificador));
  return { verificador, desafio: base64url(new Uint8Array(resumo)) };
}

async function conectarOneDrive() {
  if (!idDoAplicativo()) {
    avisar('Informe o ID do aplicativo da Microsoft antes de conectar.');
    return;
  }
  if (!window.isSecureContext || !crypto.subtle) {
    avisar('O login da Microsoft só funciona com o app publicado em um endereço https.');
    return;
  }
  const { verificador, desafio } = await gerarPkce();
  const marca = base64url(crypto.getRandomValues(new Uint8Array(12)));
  try {
    sessionStorage.setItem(`${PREFIXO}:aba`, estado.aba);
    sessionStorage.setItem(`${PREFIXO}:pkce`, JSON.stringify({ verificador, marca }));
  } catch (e) {
    avisar('O navegador bloqueou o armazenamento necessário para o login.');
    return;
  }
  const parametros = new URLSearchParams({
    client_id: idDoAplicativo(),
    response_type: 'code',
    redirect_uri: enderecoDeRetorno(),
    response_mode: 'query',
    scope: ONEDRIVE_ESCOPOS,
    state: marca,
    code_challenge: desafio,
    code_challenge_method: 'S256',
    prompt: 'select_account',
  });
  location.assign(`https://login.microsoftonline.com/${autoridadeOneDrive()}/oauth2/v2.0/authorize?${parametros}`);
}

function limparEnderecoDoLogin() {
  if (location.search) history.replaceState(history.state, '', enderecoDeRetorno());
}

async function trocarPorToken(extra) {
  const corpo = new URLSearchParams({ client_id: idDoAplicativo(), scope: ONEDRIVE_ESCOPOS, ...extra });
  const resposta = await fetch(`https://login.microsoftonline.com/${autoridadeOneDrive()}/oauth2/v2.0/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: corpo,
  });
  const dadosToken = await resposta.json().catch(() => ({}));
  if (!resposta.ok) {
    const erro = new Error(dadosToken.error_description || 'falha no login');
    erro.oauth = dadosToken.error;
    throw erro;
  }
  guardarSessaoOneDrive({
    token: dadosToken.access_token,
    refresh: dadosToken.refresh_token || lerSessaoOneDrive().refresh,
    expiraEm: Date.now() + Math.max(60, (dadosToken.expires_in || 3600) - 120) * 1000,
  });
  return dadosToken.access_token;
}

async function tokenDoOneDrive() {
  const s = lerSessaoOneDrive();
  if (s.token && Date.now() < (s.expiraEm || 0)) return s.token;
  if (!s.refresh) return null;
  try {
    return await trocarPorToken({ grant_type: 'refresh_token', refresh_token: s.refresh });
  } catch (e) {
    if (!navigator.onLine || !e.oauth) throw Object.assign(new Error('sem internet'), { rede: true });
    guardarSessaoOneDrive({ token: null, expiraEm: 0, refresh: null });
    estado.erroOneDrive = 'A ligação com o OneDrive expirou. Toque em Conectar de novo.';
    return null;
  }
}

async function processarRetornoDoLogin() {
  const parametros = new URLSearchParams(location.search);
  if (parametros.get('error')) {
    estado.erroOneDrive = `A Microsoft recusou o login: ${parametros.get('error_description') || parametros.get('error')}`;
    limparEnderecoDoLogin();
    return;
  }
  const codigo = parametros.get('code');
  if (!codigo) return;
  let guardado = {};
  try { guardado = JSON.parse(sessionStorage.getItem(`${PREFIXO}:pkce`) || '{}'); } catch (e) { /* ignora */ }
  try { sessionStorage.removeItem(`${PREFIXO}:pkce`); } catch (e) { /* ignora */ }
  limparEnderecoDoLogin();
  if (!guardado.verificador || guardado.marca !== parametros.get('state')) {
    estado.erroOneDrive = 'A resposta do login não confere. Tente conectar de novo.';
    return;
  }
  try {
    await trocarPorToken({
      grant_type: 'authorization_code',
      code: codigo,
      code_verifier: guardado.verificador,
      redirect_uri: enderecoDeRetorno(),
    });
    estado.erroOneDrive = '';
    const conta = await chamarGraph('/me?$select=displayName,userPrincipalName').catch(() => null);
    if (conta) guardarSessaoOneDrive({ conta: conta.userPrincipalName || conta.displayName || '' });
    estado.recemConectado = true;
  } catch (e) {
    estado.erroOneDrive = `Não foi possível concluir o login: ${e.message}`;
  }
}

async function chamarGraph(caminho, opcoes = {}) {
  const token = await tokenDoOneDrive();
  if (!token) throw Object.assign(new Error('sem ligação'), { semLigacao: true });
  let resposta;
  try {
    resposta = await fetch(`https://graph.microsoft.com/v1.0${caminho}`, {
      ...opcoes,
      headers: { Authorization: `Bearer ${token}`, ...(opcoes.headers || {}) },
    });
  } catch (e) {
    throw Object.assign(new Error('sem internet'), { rede: true });
  }
  if (resposta.status === 401) {
    guardarSessaoOneDrive({ token: null, expiraEm: 0 });
    throw Object.assign(new Error('autorização expirada'), { semLigacao: true });
  }
  if (!resposta.ok) {
    const corpo = await resposta.json().catch(() => ({}));
    const erro = new Error((corpo.error && corpo.error.message) || `erro ${resposta.status}`);
    erro.status = resposta.status;
    throw erro;
  }
  if (opcoes.texto) return resposta.text();
  if (resposta.status === 204) return null;
  return resposta.json();
}

function tamanhoLegivel(bytes) {
  const kb = Math.round((bytes || 0) / 1024);
  return kb > 1024 ? `${numero(kb / 1024, 1)} MB` : `${numero(Math.max(1, kb))} KB`;
}

function guardarItens(itens) {
  estado.itensOneDrive = new Map(itens.map(i => [i.id, i]));
}

function abrirEscolhaDeArquivo() {
  return abrirNavegadorOneDrive({ id: 'root', nome: 'OneDrive', trilha: [] });
}

async function abrirNavegadorOneDrive(pasta) {
  const atual = pasta || estado.pastaOneDrive || { id: 'root', nome: 'OneDrive', trilha: [] };
  estado.pastaOneDrive = atual;
  const trilha = [...atual.trilha.map(t => t.nome), atual.nome].join(' › ');
  abrirModal({
    titulo: 'Arquivo no OneDrive',
    subtitulo: esc(trilha),
    corpo: `<p class="detalhe">Escolha o Cinemateca.json que outro aparelho já usa, ou crie um arquivo novo.</p>
      <div class="linha-chave" style="margin:12px 0 6px">
        <input type="search" placeholder="Procurar pelo nome" data-busca-onedrive aria-label="Procurar arquivo no OneDrive">
        <button type="button" class="botao" data-acao="procurar-onedrive">Procurar</button>
      </div>
      <p class="detalhe" data-pasta-status>Abrindo…</p>
      <ul class="lista-escolha" data-itens-onedrive></ul>`,
    rodape: `${atual.trilha.length ? '<button type="button" class="botao esquerda" data-acao="voltar-pasta-onedrive">Voltar</button>' : ''}<button type="button" class="botao" data-acao="fechar-modal">Fechar</button><button type="button" class="botao primario" data-acao="criar-arquivo-onedrive">Criar arquivo novo</button>`,
  });
  try {

    const r = await chamarGraph(`${caminho}?$select=id,name,folder,file,size,lastModifiedDateTime,eTag&$top=200`);
    const todos = r.value || [];
    const pastas = todos.filter(i => i.folder).sort((a, b) => colador.compare(a.name, b.name));
    const arquivos = todos.filter(i => !i.folder && /\.json$/i.test(i.name)).sort((a, b) => colador.compare(a.name, b.name));
    guardarItens([...pastas, ...arquivos]);
    mostrarItensOneDrive(pastas, arquivos, todos.length);
  } catch (e) {
    const status = document.querySelector('[data-pasta-status]');
    if (status) status.textContent = e.semLigacao ? 'A ligação expirou. Feche e toque em Conectar de novo.' : `Não foi possível abrir a pasta: ${e.message}`;

function mostrarItensOneDrive(pastas, arquivos, total, buscando) {
  const status = document.querySelector('[data-pasta-status]');
  const lista = document.querySelector('[data-itens-onedrive]');
  if (!status || !lista) return;
  if (!pastas.length && !arquivos.length) {
    status.textContent = buscando
      ? 'Nada encontrado com esse nome. Arquivos criados há pouco podem demorar a aparecer na busca; navegue pelas pastas.'
      : total ? 'Esta pasta não tem subpastas nem arquivos .json.' : 'Esta pasta está vazia.';
    lista.innerHTML = '';
    return;
  }
  status.textContent = buscando ? 'Resultados da busca.' : 'Abra as pastas e toque no arquivo que o app deve manter sincronizado.';
  lista.innerHTML = [
    ...pastas.map(f => `<li><div><p class="nome">${esc(f.name)}</p><p class="detalhe">Pasta</p></div>
      <button type="button" class="botao pequeno" data-acao="abrir-pasta-onedrive" data-id="${esc(f.id)}">Abrir</button></li>`),
    ...arquivos.map(a => `<li><div><p class="nome">${esc(a.name)}</p><p class="detalhe">${esc(tamanhoLegivel(a.size))}, alterado em ${esc(dataHoraBR(a.lastModifiedDateTime))}</p></div>
      <button type="button" class="botao primario pequeno" data-acao="usar-arquivo-onedrive" data-id="${esc(a.id)}">Usar este</button></li>`),
  ].join('');
}

async function procurarNoOneDrive() {
  const campo = document.querySelector('[data-busca-onedrive]');
  const termo = ((campo && campo.value) || '').trim();
  const status = document.querySelector('[data-pasta-status]');

  if (status) status.textContent = 'Procurando…';
  try {
    const r = await chamarGraph(`/me/drive/root/search(q='${encodeURIComponent(termo.replace(/'/g, "''"))}')?$select=id,name,size,lastModifiedDateTime,eTag,folder,file&$top=50`);
    const arquivos = (r.value || []).filter(i => !i.folder && /\.json$/i.test(i.name));
    guardarItens(arquivos);
    mostrarItensOneDrive([], arquivos, arquivos.length, true);
  } catch (e) {
    if (status) status.textContent = e.semLigacao ? 'A ligação expirou. Feche e toque em Conectar de novo.' : `Não foi possível procurar: ${e.message}`;
  }
}

function abrirPastaOneDrive(id) {
  const pasta = (estado.itensOneDrive || new Map()).get(id);
  if (!pasta) return;

}

function voltarPastaOneDrive() {
  const atual = estado.pastaOneDrive;
  if (!atual || !atual.trilha.length) return;
  const anterior = atual.trilha[atual.trilha.length - 1];
  abrirNavegadorOneDrive({ id: anterior.id, nome: anterior.nome, trilha: atual.trilha.slice(0, -1) });

async function usarArquivoOneDrive(id) {
  const arquivo = (estado.itensOneDrive || new Map()).get(id);
  if (!arquivo) return;

/* ===== Sincronização ===== */

function assinaturaLocal() {
  const { ultimoBackup, ...preferencias } = dados.preferencias;
  const texto = JSON.stringify({ t: dados.titulos, r: dados.registros, p: dados.plataformas, m: dados.metas, preferencias });
  return `${texto.length}:${hashTexto(texto)}`;
}

function agendarSincronizacao() {
  if (!oneDriveLigado() || !lerSessaoOneDrive().item) return;
  clearTimeout(estado.sincTimer);
  estado.sincTimer = setTimeout(() => sincronizarOneDrive({ automatico: true }), 2500);
}

async function sincronizarOneDrive({ automatico = false, primeiraVez = false } = {}) {
  const sessao = lerSessaoOneDrive();
  if (!sessao.item) {
    if (!automatico) avisar('Escolha primeiro o arquivo do OneDrive.');
    return;
  }
  if (estado.sincronizando) { estado.sincPendente = true; return; }
  if (!navigator.onLine) {
    estado.erroOneDrive = automatico ? '' : 'Sem internet agora. As alterações vão para o OneDrive quando a conexão voltar.';
    renderEstadoSalvo();
    return;
  }
  estado.sincronizando = true;
  estado.sincPendente = false;
  renderEstadoSalvo();
  try {
    const meta = await chamarGraph(`/me/drive/items/${sessao.item.id}?$select=id,name,eTag,lastModifiedDateTime,size`);
    const remotoMudou = !sessao.item.eTag || meta.eTag !== sessao.item.eTag;
    const localMudou = !sessao.assinatura || sessao.assinatura !== assinaturaLocal();
    if (primeiraVez && remotoMudou) {
      await escolherNaPrimeiraVez(meta);
    } else if (remotoMudou && !localMudou) {
      await baixarDoOneDrive(meta);
      avisar('Diário atualizado com a versão do OneDrive.');
    } else if (localMudou && !remotoMudou) {
      await enviarParaOneDrive(meta);
    } else if (remotoMudou && localMudou) {
      await resolverConflito(meta);
    }
    estado.erroOneDrive = '';
    guardarSessaoOneDrive({ ultimoSync: new Date().toISOString() });
  } catch (e) {
    if (e.rede) estado.erroOneDrive = automatico ? '' : 'Sem conexão com o OneDrive agora.';
    else if (e.semLigacao) estado.erroOneDrive = 'A ligação com o OneDrive expirou. Toque em Conectar de novo.';
    else if (e.status === 404) estado.erroOneDrive = 'O arquivo não está mais no OneDrive. Escolha outro em Configurações.';
    else if (e.status === 412) { estado.erroOneDrive = ''; estado.sincPendente = true; }
    else if (e.formato) estado.erroOneDrive = 'O arquivo do OneDrive não é um diário da cinemateca. Escolha outro em Configurações.';
    else estado.erroOneDrive = `Não foi possível sincronizar: ${e.message}`;
  } finally {
    estado.sincronizando = false;
    renderEstadoSalvo();
    if (estado.aba === 'config') render();
    if (estado.sincPendente) {
      estado.sincPendente = false;
      agendarSincronizacao();
    }
  }
}

async function baixarDoOneDrive(meta) {
  const sessao = lerSessaoOneDrive();
  const texto = await chamarGraph(`/me/drive/items/${sessao.item.id}/content`, { texto: true });
  let novos;
  try {
    novos = lerArquivoDeDados(texto);
  } catch (e) {
    throw Object.assign(new Error('formato desconhecido'), { formato: true });
  }
  const chaveAtual = chaveTMDB();
  dados = novos;
  if (!dados.preferencias.chaveTMDB && chaveAtual) dados.preferencias.chaveTMDB = chaveAtual;
  reindexar();
  await gravarAgora();
  guardarSessaoOneDrive({ item: { ...sessao.item, eTag: meta.eTag }, assinatura: assinaturaLocal() });
  renderSuave();
}

async function enviarParaOneDrive(meta) {
  const sessao = lerSessaoOneDrive();
  if (dados.preferencias.ultimoBackup !== hojeISO()) {
    dados.preferencias.ultimoBackup = hojeISO();
    agendarGravacao();
  }
  const novo = await chamarGraph(`/me/drive/items/${sessao.item.id}/content`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'if-match': meta.eTag },
    body: arquivoDeDados(),
  });
  guardarSessaoOneDrive({ item: { ...sessao.item, eTag: (novo && novo.eTag) || null }, assinatura: assinaturaLocal() });
}

async function escolherNaPrimeiraVez(meta) {
  const sessao = lerSessaoOneDrive();
  if (!dados.registros.length && !dados.titulos.length) {
    await baixarDoOneDrive(meta);
    avisar('Diário trazido do OneDrive.');
    return;
  }
  const escolha = await escolherEntre({
    titulo: 'Qual versão vale?',
    texto: `Este aparelho tem ${plural(dados.registros.length, 'registro', 'registros')} e o arquivo ${sessao.item.nome}, no OneDrive, foi alterado em ${dataHoraBR(meta.lastModifiedDateTime)}. A partir de agora os dois ficam sincronizados; escolha qual versão fica valendo.`,
    opcoes: ['Cancelar', 'Trazer a do OneDrive', 'Enviar a deste aparelho'],
  });
  if (escolha === 1) await baixarDoOneDrive(meta);
  if (escolha === 2) await enviarParaOneDrive(meta);
}

async function resolverConflito(meta) {
  const escolha = await escolherEntre({
    titulo: 'Os dois lados mudaram',
    texto: `O arquivo no OneDrive foi alterado em ${dataHoraBR(meta.lastModifiedDateTime)}, provavelmente por outro aparelho, e este aparelho também tem alterações. Nada foi sobrescrito ainda.`,
    opcoes: ['Decidir depois', 'Trazer a do OneDrive', 'Enviar a deste aparelho'],
  });
  if (escolha === 1) await baixarDoOneDrive(meta);
  if (escolha === 2) await enviarParaOneDrive(meta);
}

async function desligarOneDrive() {
  const ok = await confirmar({
    titulo: 'Desligar o OneDrive',
    texto: 'O app para de sincronizar e mantém o diário guardado neste aparelho. O arquivo no OneDrive não é apagado.',
    ok: 'Desligar',
  });
  if (!ok) return;
  limparSessaoOneDrive();
  estado.erroOneDrive = '';
  render();
  avisar('OneDrive desligado.');
}

function textoSituacaoOneDrive() {
  const s = lerSessaoOneDrive();
  if (!oneDriveLigado()) return 'Não conectado.';
  const partes = [`Conectado${s.conta ? ` como ${s.conta}` : ''}`];
  if (s.item) partes.push(`arquivo ${s.item.nome}${s.item.caminho ? ` em ${s.item.caminho}` : ''}`);
  else partes.push('nenhum arquivo escolhido');
  if (s.ultimoSync) partes.push(`última sincronização em ${dataHoraBR(s.ultimoSync)}`);
  return partes.join(', ') + '.';
}

async function iniciarOneDrive() {
  await processarRetornoDoLogin();
  let abaAntes = '';
  try {
    abaAntes = sessionStorage.getItem(`${PREFIXO}:aba`) || '';
    sessionStorage.removeItem(`${PREFIXO}:aba`);
  } catch (e) { /* ignora */ }
  if (estado.recemConectado) {
    estado.recemConectado = false;
    if (abaAntes && TELAS[abaAntes]) irPara(abaAntes);
    else render();
    const s = lerSessaoOneDrive();
    if (s.item) await sincronizarOneDrive({ primeiraVez: !s.assinatura });
    else await abrirEscolhaDeArquivo();
    return;
  }
  if (estado.erroOneDrive && abaAntes === 'config') irPara('config');
  if (oneDriveLigado() && lerSessaoOneDrive().item) await sincronizarOneDrive({ automatico: true });
  renderEstadoSalvo();
}

async function criarArquivoNoOneDrive(form) {
  const campo = form.querySelector('[name="nome"]');
  const erro = form.querySelector('[data-erro-form]');
  let nome = (campo.value || '').trim() || NOME_ARQUIVO_NUVEM;
  if (!/\.json$/i.test(nome)) nome += '.json';
  if (/[\\/:*?"<>|]/.test(nome)) { erro.textContent = 'O nome não pode ter os caracteres \\ / : * ? " < > |'; return; }
  erro.textContent = 'Criando…';
  try {
    const item = await chamarGraph(`/me/drive/root:/${encodeURIComponent(nome)}:/content?@microsoft.graph.conflictBehavior=rename`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: arquivoDeDados(),
    });
    guardarSessaoOneDrive({
      item: { id: item.id, nome: item.name, caminho: 'raiz do OneDrive', eTag: item.eTag || null },
      assinatura: assinaturaLocal(),
      ultimoSync: new Date().toISOString(),
    });
    estado.erroOneDrive = '';
    fecharModal();
    render();
    avisar(`${item.name} criado no OneDrive e ligado ao app.`);
  } catch (e) {
    erro.textContent = e.semLigacao ? 'A ligação expirou. Feche e toque em Conectar de novo.' : `Não foi possível criar: ${e.message}`;
  }
}

async function guardarETestarChave(contexto, botao) {
  const caixa = botao.closest('.cartao-chave') || document;
  const campo = caixa.querySelector('[data-chave-tmdb]');
  const situacao = () => caixa.querySelector('[data-situacao-chave]');
  const valor = ((campo && campo.value) || '').trim().replace(/^Bearer\s+/i, '').replace(/\s+/g, '');
  if (!valor) {
    if (chaveTMDB()) alterar(() => { dados.preferencias.chaveTMDB = ''; }, { renderizar: false });
    if (situacao()) situacao().textContent = 'Nenhuma chave guardada. Cole a chave e toque em Testar.';
    return;
  }
  if (situacao()) situacao().textContent = 'Testando a chave…';
  botao.disabled = true;
  let texto;
  try {
    const r = await tmdb('search/movie', { query: 'Central do Brasil', year: 1998 }, { chave: valor, tentativas: 1 });
    const achado = r && r.results && r.results[0];
    texto = achado ? `Chave funcionando: o TMDB encontrou ${achado.title}${anoDaData(achado.release_date) ? ` (${anoDaData(achado.release_date)})` : ''}.` : 'Chave aceita pelo TMDB.';
  } catch (e) {
    botao.disabled = false;
    if (e.tipo !== 'rede') {
      if (situacao()) situacao().textContent = explicarErroTMDB(e);
      return;
    }
    texto = 'Chave guardada. Sem internet agora para testar; o teste acontece na primeira busca.';
  }
  estado.busca.vitrine = null;
  estado.busca.erroVitrine = '';
  estado.cacheDetalhes.clear();
  alterar(() => { dados.preferencias.chaveTMDB = valor; }, { renderizar: false });
  avisar(texto);
  if (contexto === 'busca') {
    atualizarConteudoBusca();
    carregarVitrineNaBusca();
    const busca = document.querySelector('[data-busca-tmdb]');
    if (busca) busca.focus();
  } else if (contexto === 'importacao') {
    abrirImportacao();
  } else if (contexto === 'serializd') {
    abrirImportacaoSerializd();
  } else {
    render();
    const nova = document.querySelector('[data-situacao-chave]');
    if (nova) nova.textContent = texto;
  }
  setTimeout(atualizarEmSegundoPlano, 800);
}

function mudarPlataforma(campo) {
  const p = plataformaPorId(campo.dataset.id);
  if (!p) return;
  if (campo.dataset.plataformaCampo === 'nome') {
    const nome = campo.value.trim().replace(/\s+/g, ' ');
    if (!nome) { campo.value = p.nome; return; }
    if (nome === p.nome) return;
    const personalizada = !PLATAFORMAS_PADRAO.some(x => x.id === p.id);
    alterar(() => {
      p.nome = nome;
      if (personalizada) p.busca = [chaveTexto(nome)];
    }, { mensagem: 'Lugar renomeado.', renderizar: false });
  } else {
    const cor = corSegura(campo.value, p.cor);
    if (cor === p.cor) return;
    alterar(() => { p.cor = cor; }, { renderizar: false });
  }
}

  registro: form => salvarRegistro(form),
  titulo: form => salvarTitulo(form),
  meta: form => enviarMeta(form),
  'arquivo-novo': form => criarArquivoNoOneDrive(form),
};

/* ===== Gestos ===== */

function ligarNotaPorArrasto() {
  document.addEventListener('pointerdown', e => {
    const alvo = e.target.closest && e.target.closest('[data-nota-alvo]');
    if (!alvo || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const caixa = alvo.closest('[data-nota-entrada]');
    const valorEm = x => {
      const r = alvo.getBoundingClientRect();
      return Math.min(5, Math.max(0.5, Math.ceil(((x - r.left) / r.width) * 10) / 2));
    };
    const antes = Number(caixa.querySelector('[name="nota"]').value) || 0;
    const inicial = valorEm(e.clientX);
    const x0 = e.clientX;
    let moveu = false;
    const mover = ev => {
      if (!moveu && Math.abs(ev.clientX - x0) < 6) return;
      moveu = true;
      definirNota(caixa, valorEm(ev.clientX));
    };
    const encerrar = () => {
      alvo.removeEventListener('pointermove', mover);
      alvo.removeEventListener('pointerup', soltar);
      alvo.removeEventListener('pointercancel', cancelar);
      estado.notaArrastada = Date.now();
    };
    const soltar = ev => {
      encerrar();
      const final = moveu ? valorEm(ev.clientX) : inicial;
      definirNota(caixa, !moveu && final === antes ? 0 : final);
    };
    const cancelar = () => {
      encerrar();
      definirNota(caixa, antes);
    };
    try { alvo.setPointerCapture(e.pointerId); } catch (erro) { /* segue sem captura */ }
    alvo.addEventListener('pointermove', mover);
    alvo.addEventListener('pointerup', soltar);
    alvo.addEventListener('pointercancel', cancelar);
  });
}

function ligarDeslizar() {
  let inicioX = null;
  let inicioY = null;
  let inicioEm = 0;
  document.addEventListener('touchstart', e => {
    inicioX = null;
    if (e.touches.length !== 1) return;
    const alvo = e.target;
    if (alvo.closest && alvo.closest('dialog, .fila, .filtros, .segmentado, .tabela, .festa, input, textarea, select, [data-nota-alvo]')) return;
    const toque = e.touches[0];
    if (toque.clientX < 28 || toque.clientX > innerWidth - 28) return;
    inicioX = toque.clientX;
    inicioY = toque.clientY;
    inicioEm = Date.now();
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (inicioX === null) return;
    const toque = e.changedTouches[0];
    const dx = toque.clientX - inicioX;
    const dy = toque.clientY - inicioY;
    const tempo = Date.now() - inicioEm;
    inicioX = null;
    if (tempo > 700 || Math.abs(dx) < 70 || Math.abs(dy) > 55) return;
    if (document.querySelector('dialog[open]')) return;
    const atual = ORDEM_ABAS.indexOf(estado.aba);
    if (atual === -1) {
      if (dx > 0) irPara('inicio');
      return;
    }
    const destino = atual + (dx < 0 ? 1 : -1);
    if (destino < 0 || destino >= ORDEM_ABAS.length) return;
    irPara(ORDEM_ABAS[destino]);
  }, { passive: true });
}

function bloquearZoom() {
  const instalado = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  if (!instalado) return;
  document.documentElement.classList.add('sem-zoom');
  const impedir = e => { if (e.cancelable) e.preventDefault(); };
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(nome => document.addEventListener(nome, impedir, { passive: false }));
  document.addEventListener('touchmove', e => {
    if (e.touches.length > 1 && e.cancelable) e.preventDefault();
  }, { passive: false });
}

/* ===== Eventos ===== */

function ligarEventos() {
  bloquearZoom();
  ligarDeslizar();
  ligarNotaPorArrasto();

  document.addEventListener('click', e => {
    const alvo = e.target.closest('[data-acao]');
    if (!alvo || alvo.disabled) return;
    const acao = ACOES[alvo.dataset.acao];
    if (!acao) return;
    e.preventDefault();
    acao(alvo, e);
  });

  document.addEventListener('pointerdown', e => {
    const chip = e.target.closest && e.target.closest('label.chip');
    const radio = chip && chip.querySelector('input[type="radio"][name="onde"]');
    if (radio) radio.dataset.estava = radio.checked ? '1' : '';
  }, true);

  document.addEventListener('click', e => {
    const el = e.target;
    if (!(el.matches && el.matches('input[type="radio"][name="onde"]'))) return;
    if (el.dataset.estava === '1') {
      el.checked = false;
      if (estado.formulario) estado.formulario.ondeTocado = true;
    }
    el.dataset.estava = '';
  }, true);

  document.addEventListener('submit', e => {
    const enviar = FORMULARIOS[e.target.dataset.form];
    if (!enviar) return;
    e.preventDefault();
    enviar(e.target);
  });

  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-acao]')) {
      e.preventDefault();
      e.target.click();
    }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-busca-tmdb]')) {
      e.preventDefault();
      clearTimeout(estado.buscaTimer);
      executarBusca();
      e.target.blur();
    }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-filtro-busca]')) e.target.blur();
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-chave-tmdb]')) {
      e.preventDefault();
      const botao = e.target.closest('.cartao-chave').querySelector('[data-acao="guardar-chave"]');
      if (botao) botao.click();
    }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-usuario-serializd]')) {
      e.preventDefault();
      lerSerializdDireto();
    }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-busca-onedrive]')) {
      e.preventDefault();
      procurarNoOneDrive();
    }
  });

  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.filtroBusca) {
      estado[el.dataset.filtroBusca].busca = el.value;
      atualizarResultados();
    }
    if (el.hasAttribute('data-busca-tmdb')) {
      estado.busca.termo = el.value;
      clearTimeout(estado.buscaTimer);
      if (!el.value.trim()) executarBusca();
      else estado.buscaTimer = setTimeout(executarBusca, 380);
    }
  });

  document.addEventListener('change', e => {
    const el = e.target;
    const f = estado.formulario;
    if (el.matches('[data-arquivo]')) {
      const arquivo = el.files && el.files[0];
      el.value = '';
      if (!arquivo) return;
      if (estado.arquivoPara === 'restaurar') restaurarArquivo(arquivo);
      if (estado.arquivoPara === 'importar') lerArquivoImportacao(arquivo);
      if (estado.arquivoPara === 'serializd') lerArquivoSerializd(arquivo);
      return;
    }
    if (el.matches('[data-arquivo-poster]')) {
      const arquivo = el.files && el.files[0];
      el.value = '';
      if (arquivo) aplicarPosterNoFormulario(arquivo);
      return;
    }
    if (el.dataset.plataformaCampo) { mudarPlataforma(el); return; }
    if (el.dataset.metaAno) {
      const n = parseInt(el.value, 10);
      if (n > 0) alterar(() => { dados.metas[el.dataset.metaAno] = n; }, { mensagem: `Meta de ${el.dataset.metaAno}: ${plural(n, 'filme', 'filmes')}.`, renderizar: false });
      else el.value = dados.metas[el.dataset.metaAno] || '';
      return;
    }
    const form = el.closest('form[data-form="registro"]');
    if (!form || !f) return;
    if (el.name === 'quando') {
      const campoData = form.querySelector('[data-campo-data]');
      campoData.hidden = el.value !== 'outra';
      if (el.value === 'outra') {
        const data = campoData.querySelector('input');
        if (!data.value) data.value = ontemISO();
        try { data.showPicker(); } catch (erro) { data.focus(); }
      }
    }
    if (el.name === 'm-tipo') {
      f.tipoTitulo = el.value;
      form.querySelector('[data-bloco-serie]').hidden = el.value !== 'serie';
      form.querySelector('[data-acao="so-assistindo"]').hidden = el.value !== 'serie';
      form.querySelector('[data-legenda-quando]').textContent = el.value === 'serie' ? 'Quando você terminou' : 'Quando você assistiu';
      if (el.value === 'serie') form.querySelector('[data-temporadas]').innerHTML = opcoesTemporadasHTML({ temporadas: [] }, 1);
    }
    if (el.name === 'temporada') { f.temporadaTocada = true; atualizarSituacaoSugerida(form); }
    if (el.name === 'situacao') f.situacaoTocada = true;
    if (el.name === 'revisto') f.revistoTocado = true;
    if (el.name === 'onde') f.ondeTocado = true;
    if (el.name === 'genero') {
      f.generosTocados = true;
      const resumo = form.querySelector('[data-resumo-generos]');
      if (resumo) resumo.textContent = resumoGeneros([...form.querySelectorAll('[name="genero"]:checked')].map(c => c.value));
    }
  });

  document.addEventListener('focusout', e => {
    if (!e.target.matches || !e.target.matches('input, textarea, select')) return;
    setTimeout(() => {
      const ativo = document.activeElement;
      if (ativo && ativo.matches && ativo.matches('input, textarea, select')) return;
      window.scrollTo(window.scrollX, window.scrollY);
    }, 80);
  });

  document.addEventListener('toggle', e => {
    const secao = e.target;
    if (!secao || !secao.matches || !secao.matches('details.config-secao')) return;
    if (secao.open) estado.configAbertas.add(secao.dataset.secao);
    else estado.configAbertas.delete(secao.dataset.secao);
  }, true);

  document.addEventListener('error', e => {
    const img = e.target;
    if (!img || img.tagName !== 'IMG') return;
    const poster = img.closest('.poster');
    if (poster) poster.classList.add('falhou');
    else if (img.closest('.provedor')) img.remove();
  }, true);

  $('#modal').addEventListener('close', () => {
    estado.fichaAberta = null;
    estado.formulario = null;
  });

  window.addEventListener('popstate', e => {
    const aba = (e.state && e.state.aba) || 'inicio';
    if (aba === estado.aba) return;
    estado.aba = aba;
    render();
    window.scrollTo(0, 0);
  });

  window.addEventListener('online', () => {
    estado.erroOneDrive = '';
    agendarSincronizacao();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    const s = lerSessaoOneDrive();
    const ultima = s.ultimoSync ? Date.parse(s.ultimoSync) : 0;
    if (oneDriveLigado() && s.item && Date.now() - ultima > 60000) sincronizarOneDrive({ automatico: true });
    if (estado.aba === 'inicio' && !document.querySelector('dialog[open]')) renderSuave();
  });

  if (window.matchMedia) {
    const escuro = window.matchMedia('(prefers-color-scheme: dark)');
    const mudou = () => atualizarCorDoTema();
    if (escuro.addEventListener) escuro.addEventListener('change', mudou);
    else if (escuro.addListener) escuro.addListener(mudou);
  }
  atualizarCorDoTema();
}

function iniciar() {
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  iniciarApp().catch(e => {
    const app = document.getElementById('app');
    if (app && !app.children.length) app.innerHTML = `<p style="padding:24px">Não foi possível abrir o app: ${esc(e && e.message)}</p>`;
    setTimeout(() => { throw e; });
  });
}

iniciar();

})();
</script>
